storylines:
  title: The Usual Suspects
  cast:
  - name: The Cat Lobby
    player: Sarah Black
    type: single-issue advocate
    style: spotlight
    motif: one platform, zero concessions
    note: 'Her biggest week since the lobby was founded. A round about unusual instruments
      produced a scale with a cat at one end, and the constituency was welcomed, expanded
      and purged inside a single hour.

      '
    spotlight:
      text: I was going to formally welcome you to the cat lobby but now you’re 86ed like
        JAC
      caption: membership revoked eleven minutes after it was offered · aug 20
    evidence:
    - Welcome to the constituency. The cat lobby thanks you.
    - Loving this energy. And especially the inclusion of space kitty
    - JB still hasn’t unpacked his suitcase from a trip that ended 2 weeks ago, because the
      cats like to sit in it.
    highlight:
    - cat lobby
    - constituency
    - space kitty
  - name: The Litigator
    player: Jonathan Black
    type: courtroom formalist
    style: quote-led
    motif: everything is a deposition
    note: 'Off the bench, because this is the week the bit got its exhibit. He attached an
      appeals process to a downvote, conceded a point while denying its premise, and litigated
      a trailing comma to a draw.

      '
    evidence:
    - If the submitter can provide me evidence this song uses a “heavily distorted acoustic
      auto-harp,” I will give you an additional +2 in next week’s category as an apology.
    - I say this only to be annoying.  I was always going to give it +1.
    - I'll try “not confuse,” bonehead.
    - I'm already talking to you on another chat.  That's how much I don't care about this
      one.
    highlight:
    - evidence
    - apology
    - annoying
    - not confuse
  note: 'Both of this week''s regulars live at the same address. One has spent the season
    lobbying for more cat coverage; the other attaches an appeals process to a downvote. Dinner
    at the Black house is presumably a hearing, with a cat on the table.


    On the bubble — two bits are one more sighting away from a card of their own. Sarah Zucker,
    who has now apologised on three separate ballots and once, pre-emptively, in the chat.
    And Jac, whose broadcast pattern he has himself described: silent for a week, then everything
    at once. Michael Layous keeps his card warm on the bench, and Tommy Chapin wrote 1,925
    characters of vote commentary this round — the most in the league — which is a bit whether
    he means it as one or not.


    Regulars are recurring Second Best bits caught in the wild. One only appears when this
    round''s chat or ballots back the bit with a real quote — every line above is verbatim.'
