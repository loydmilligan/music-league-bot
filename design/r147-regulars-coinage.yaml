    An older man visibly straining to keep up with what's current —
    unc (out-of-touch uncle) + chopped (ugly, busted).
  # `on:` is a reserved boolean in YAML 1.1 and a bare date parses as a date
  # object, so this is `date:` and quoted. A comma inside a flow mapping splits
  # it, so this is a block mapping with an explicit `context:`.
  coined:
    by: Steiny
    date: "2026-08-09"
    at: Jensen
    context: over an Outside Lands gif
