      speaker: Steiny
      text: "Jensen besides feeling like a chopped unc what were the musical highlights of your adventure"
    - label: the lookup
      speaker: Mashew
      text: "Man, I thought chopped unc sounded cool, but apparently it means ugly or uncool old person"
    - label: best
      speaker: Shane
      text: "I guess we're all chopped uncs"
