# R147 "I Hope You Shit Your Pants at Target" (Boarz II Men) — hand-authored
# content for The Usual Suspects + The Coinage.
#
# EVERY number and quote below was verified against data/league.db over the
# round window 2026-08-06T04:03:44Z → 2026-08-13T06:30:01Z ("this week") and
# season 10, 2026-07-24 → 2026-08-13 ("this season"), chat group
# "Boarz II Men - Music League". Nothing here is an LLM estimate.
#
# v2 — owner rewrite. The first pass was too busy to follow: each entry stacked
# a paragraph, two stats, a boxed example and three quotes. Now each entry is
# ONE idea, named for its archetype rather than its player, with the evidence
# doing the rest. `name` = the archetype, `player` = who it actually is.

title: The Usual Suspects
cast:
  # ── The Editor ────────────────────────────────────────────────────────────
  # 13 posts sent more than once in the round window; the largest cluster is 3
  # versions. WhatsApp edits land in the archive as new messages, so every
  # attempt survives — that's how this is countable at all.
  - name: The Editor
    player: Mashew
    type: self-corrector
    style: edit-history
    motif: double-edits
    note: >
      The Editor shows his face by sending the same message twice — and when
      the wording really matters, three times.
    stats:
      - { value: 13, label: posts sent more than once }
      - { value: 3, label: versions of one post }
    example:
      # Verified: three versions of this message, all stamped 2026-08-13T05:51:07.
      # Struck text is what he first wrote; the replacement follows it.
      repairs:
        - { was: her was to tell your, now: "her, this" }
      text: "your response to ⟨her was to tell your⟩ wife who puts up with soooo much, just to send you a message on whats app"
      caption: three versions of one sentence · aug 13

  # ── The Consul ────────────────────────────────────────────────────────────
  # 18 one-word declarative replies to another player in season 10 (questions,
  # emoji and list numerals excluded). "Correct" accounts for three of them.
  # Consul = the chapter president in the owner's old fraternity; "tree fort
  # gang" was what they called brothers a little too invested in the ritual.
  - name: The Consul
    player: Conor
    type: one-word oracle
    style: call-response
    motif: one-word rulings
    note: >
      Eighteen times this season the Consul declined to spend a second word.
      Three of them were "Correct." The ruling comes down, the chapter moves on.
    exchanges:
      - { prompt: "Jensen: So 36 hours starting with every round of votes?", reply: Correct }
      - { prompt: "Mashew: Well that was conors position", reply: Is }
      - { prompt: "Jensen: Make it 36 hours and you've got yourself a deal", reply: Deal }

note: ""

# ── The Coinage → stats_content_json.phrase ──────────────────────────────────
phrase:
