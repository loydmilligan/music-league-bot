# ── The Regulars → storylines content_json ───────────────────────────────────
title: Time for a Reinvention
cast:
  - name: Mashew
    type: sloppy-fast typist
    style: edit-history
    motif: apostrophe-optional
    stats:
      - { value: 12, label: dropped apostrophes }
      - { value: 7, label: messages sent twice }
    example:
      repairs:
        - { was: teh, now: the }
      text: "I have never been in ⟨teh⟩ exact same situation"
      caption: sent twice, one letter apart · aug 13
    evidence:
      - "I dont rememebr being this wrong about someone"
      - "clements is usually our pellet whisperer - but hes gone dark since his scam went bad"
      - "alright guys - you want me jsut to end it - i guess i can"
    highlight: [dont, rememebr, hes, jsut]
    note: The apostrophes go first, then whole letters start arriving out of order. He fixed one of these.

  - name: Conor
    type: one-word oracle
    style: call-response
    motif: minimum viable profundity
    exchanges:
      - { prompt: "Mashew: Well that was conors position", reply: Is }
      - { prompt: "Jensen: So 36 hours starting with every round of votes?", reply: Correct }
      - { prompt: "Jensen: Make it 36 hours and you've got yourself a deal", reply: Deal }
      - { prompt: "Jimmy: This would've been my other submission", reply: Damnit }
      # The immediately preceding message is Mashew's "Indeed", but that carries
      # no sense on its own — the real setup is JB's line six minutes earlier,
      # and the delay is the joke. (The previous draft framed this as "the theory
      # that men who insist on their full names are gay"; nobody ever said that.)
      - { prompt: "JB: the age at which he sired Mike would suggest that moniker was well-earned", reply: Gay }
    note: He can write two hundred words on why the voting is corrupt, and did. Five times this round he did not bother.

note: ""

# ── The Coinage → stats_content_json.phrase ──────────────────────────────────
phrase:
  style: dictionary
  term: chopped unc
  pronunciation: /ˌtʃɒpt ˈʌŋk/
  part_of_speech: noun · slang
  definition: >
    An older man visibly straining to keep up with what's current —
    unc (out-of-touch uncle) + chopped (ugly, busted).
  # Three YAML traps in CD's original one-liner, all fixed here:
  #   1. `on:` is a RESERVED BOOLEAN in YAML 1.1 — it parsed as the key `True`.
  #      Renamed to `date:`.
  #   2. a bare 2026-08-09 parses as a date OBJECT, not a string → quoted.
  #   3. `at: Jensen, over an Outside Lands gif` — the comma splits the flow
  #      mapping, so the trailing phrase became its own null key. Block mapping
  #      + explicit `context:` instead.
  coined:
    by: Steiny
    date: "2026-08-09"
    at: Jensen
    context: over an Outside Lands gif
  stats: { uses: 7, speakers: 3, prior_rounds: 0 }
  usages:
    - label: original
      speaker: Steiny
      text: "Jensen besides feeling like a chopped unc what were the musical highlights of your adventure"
    - label: best
      speaker: Shane
      text: "I guess we're all chopped uncs"
  # Absolute URLs on purpose — media must NOT live under digests/d/<slug>/.
  # These are the files already shipping in the live R147 draft; verified present
  # at digests/_media/. The mock's "chopped-unc.gif" does not exist.
  media:
    src: https://digest.mattmariani.com/_media/chopped_unc.mp4
    poster: https://digest.mattmariani.com/_media/chopped_unc.jpg
    caption: the gif that started it
    alt: Jensen's Outside Lands gif
  # source: OWNER TO PROVIDE — the urbandictionary URL. Key omitted on purpose;
  # the card renders no source line when it is absent.
