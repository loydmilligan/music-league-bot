    type: ellipsis auteur
    style: script
    motif: the pause IS the punchline
    note: >
      M-DOT does not speak; he trails off. One hundred and nine of his three
      hundred and seventy-two messages this season contained ellipses — two
      hundred and thirteen dots deployed in total, each one a stage direction.
      The season's masterwork opened at 2:55 in the morning on August 30,
      mid-voting, and ran in seven lines and six pauses: a two-hander about a
      friendship, a betrayal, and the voting window. It has never been
      performed. It does not need to be…
    script:
      - { speaker: Me, line: "Listen to me" }
      - { speaker: Mara, line: "No" }
