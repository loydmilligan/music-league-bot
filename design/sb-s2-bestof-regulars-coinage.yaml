      - I'm so sorry you didn't deserve the downvote.
      - I'm really sorry but I don't like jam bands and a 40 minute song is overwhelming. I'm sure I like you though and I appreciate Phish fans as human beings.
      - I just want to say for the record that I don't want to downvote anyone.
