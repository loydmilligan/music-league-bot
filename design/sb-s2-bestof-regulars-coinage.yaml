# OWNER TO PROVIDE (visuals):
#  - Cat Lobby card: kitten-yoga photo, Gravedigger kill photo (or reuse the
#    r140 exhibits A–D), suitcase cat, Ninja + Churu. Treatment: heart-eyed
#    cat emoji stacking up the side of the card.
#  - Say What? card: drink-glass pictograms per transmission.

