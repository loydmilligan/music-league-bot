  - name: Lo Sientorita
    player: Sarah Zucker
    type: serial penitent
    style: ledger
    motif: apologizes to everything except Bad Bunny
    note: >
      Eight downvotes this season. Five arrived with an apology attached, and
      the apologies are addressed less to the submitter than to the songs
      themselves — one downvoted a dead man and apologized to him directly.
      The practice also has a pre-emptive branch: apologizing in the chat
      before any ballot has been filed. The one carve-out in the entire
      doctrine is Bad Bunny, whose defense she conducts at full volume, in
      Spanish, with no lo siento anywhere in the filing — "Ok I'm done now,"
      she wrote, which is the closest the office comes to an unqualified
      statement.
