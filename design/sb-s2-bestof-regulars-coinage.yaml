# ── The Coinage → stats_content_json.phrase ──────────────────────────────────
# Word of the Year gets the full dictionary card; the rest of the class of
# 2026 follows in coinages_of_the_year (special-section block — if the
# renderer only takes `phrase`, paste these as a second card or fold into the
# section note).
phrase:
  style: dictionary
  term: bloopin'
  pronunciation: /ˈbluːpɪn/
  part_of_speech: verb · gerund · doctrinal · word of the year
  definition: >
    1. To let it go — specifically, to decline a grudge that is available to
    you. 2. (literal, original) To play frog music on a wind synthesizer.


    The season's word by every measure that counts: fourteen uses, five
    speakers, first convert seventy-three minutes after coining, and a
    catechism ("Blooping ain't easy. But it works.") inside the hour. The
    adoption was the fastest on record and, by the archive, the word has not
    been needed since — last recorded use 12:08 the night it was coined,
    Michael Black, "Straight bloopin." A word that arrived fully formed,
    did its work, and retired undefeated. The league should be so bloopin'.
  coined:
    by: Tj Cook
    date: '2026-08-29'
    at: the league
    context: posted as a track by eddie.ewi, a man who plays frog music on a wind synth, with the instruction attached
  stats:
    uses: 14
    speakers: 5
    prior_rounds: 0
  usages:
    - label: the instruction
      speaker: Tj Cook
      text: You both need to relax and bloop.
    - label: the conversion
      speaker: Tommy Chapin
      text: I ain't like that no more.  TJ showed me a better way.  Bloopin' is the way.
    - label: the correction
      text: Not to derail....*blooping
    - label: the catechism
      text: Blooping ain't easy. But it works.
    - label: the last word
      speaker: Michael Black
      at: 12:08 am, the night it was coined
      text: Straight bloopin
  source: https://open.spotify.com/track/19sgHQjCYliXCE4fwA64D2

  # The rest of the class of 2026 — season retrospective card.
  coinages_of_the_year:
    - term: the feline assassin gang
      by: Jonathan Black
      date: '2026-08-16'
      status: ratified by a judge's son
      line: >-
        A household's name for its own cats, entered into law the same day —
        prosecution, ruling ("A human can't "murder" an animal. We can just
        waste the meat."), and a dad-joke concurrence.
    - term: all JB about it
