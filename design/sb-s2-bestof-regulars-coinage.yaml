# (7/19 → 9/20, 5,066 messages) and league.db ballot comments.
#
# This is NOT a per-round file. It is the season-retrospective special:
#   storylines → "The Usual Suspects: The Season in Cards" (8 cards)
#   stats.phrase → "The Coinage" Word of the Year + coinages_of_the_year
#
# Deployment: same as the per-round files — write storylines into
# digest_sections.content_json (kind='storylines') and the phrase block into
# digest_drafts.stats_content_json. Generation SKIPS storylines for this league
# (settings.storylines_section_leagues = {"sssc":true}), so a full regen drops
# hand-authored sections; re-apply from this file.
#
# Verification bar: every quote below is verbatim from the archive; timestamps
# are the poster's local time. Counts were computed from the archive and
# league.db, not estimated. Sources per card are noted in comments.
#
# CHAD MOMENT (one, flagged per digest-flavor.md — punch-up decision, cut or
# keep): end of the Coinage card — "I have recorded all four. I remember all
# of them. That is not a compliment I can return."
