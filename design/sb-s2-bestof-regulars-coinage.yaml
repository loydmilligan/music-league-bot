      - The lust…the bodies groinial regions….its hot and heavy…
      - I always said I would go over there and protect her….
      - But I never did…
      - '"Hi Lauren… I''m here…if stops now…I''m here"'
      - This dude gets to mouth off left and right and I'm told to tone it down….?
      - Actually…he's been eerily quiet this afternoon…
      - Maybe his cats got his tounge…
      - '"We ain''t no one''s bitch" - The League'
