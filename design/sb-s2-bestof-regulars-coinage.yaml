  # ── The Second Person ─────────────────────────────────────────────────────
  # NEW card. The "Commenter Cometh" concept, renamed — his comments are
  # literally written in second person. Verified: Tommy (player 37) filed
  # ballot comments in all 9 rounds; within every round all comments share a
  # single created_at timestamp — one sitting per round, 9 sittings, 98
  # comments, 10,544 characters. Debut sitting 2026-07-25 01:35 UTC.
  - name: The Second Person
    player: Tommy Chapin
    type: second-person narrator
    style: vignette
    motif: you are singing inside
    note: >
      Every ballot comment Tommy wrote this season was filed in a single
      sitting — nine rounds, nine sittings, ninety-eight comments, ten and a
      half thousand characters. He burst onto the scene in week one with a
      fully formed style nobody had seen before and nobody has seen since:
      each song received a second-person micro-fiction placing the voter
      inside a karaoke bar of Tommy's devising, with a cast, a setting, and —
      in the debut's masterpiece — a complete romantic arc. He never went
      fully second-person again; the form was a debut-era experiment. The
      quality never dropped. He is simply the best voter-commenter in the
      league, and week one was him introducing himself.
    vignettes:
      - label: the masterpiece
        song: Meatplow — Stone Temple Pilots
        points: -1
        text: >
          You are singing inside the diviest bar inside the diviest Chinese
          restaurant on earth.  Well drinks are only $3.  Doubles are only $5.
          It's Christmas night and the bar is filled with lowlifes and end
          stage alcoholics.  You sell coke to most of them.  The karaoke host
          starts rummaging through her purse for her vape when a bottle of
          Valtrex falls out and onto the stage.  You pick up the Valtrex and
          hand it back to her.  She seems embarrassed but you give her a wink
          and a smile and continue on singing. You go home with her later that
          night.  Merry Christmas.
      - label: the Brooklyn branch
        song: Dance Yrself Clean — LCD Soundsystem
        points: 1
        text: >
          You're singing inside the most popular karaoke bar in Brooklyn and
          nobody cares that you picked a 9min long song because everyone is
          too busy blowing themselves.  Good song.
      - label: the reassessment
        song: Turn It Off — the Book of Mormon cast
        points: 1
        text: Fun.  2nd gayest song on this list.
      - label: the confession
        song: Alone — Heart
        points: 2
        text: I don't possess the confidence to dream this big.
      - label: the self-portrait
        song: Wet Dream — Wet Leg
        points: 1
        text: >
          You don't care about attracting the wrong attention.  You just want
          to have fun and express yourself.  You are an artist.  Such a fun
          song.
      - label: the history lesson
        song: Rasputin — Boney M.
        points: 1
        text: >
          Maybe the most European sounding song of all time.  A very specific
          sound and vibe built by, and for, the spawn of the overly serious
          first hand witnesses and participants of WWII.  Fuck that noise dog.
          … everyone ate amphetamines upon waking at 2pm to fuel their
          afternoon into evening song writing sessions where every weird idea
          was a genius idea. … their brains floating inside a based hedonistic
          fog they never questioned or challenged.  God bless 'em.  This song
          is indeed a banger!
      - label: the apology-downvote
        song: Rosa Parks — Outkast
        points: -1
        text: >
          This song is great. I'm just bitter that my Bombs Over Bagdad
          selection a few weeks back didn't get much love and I'm taking it
          out on you.  I'm a POS. … Anyway...Andre's step dad sounds like a
          super talented human being.  Also, SHOUT OUT to step-dads!  I love
          you.
    # After week one the second person retired; the standard did not. A
