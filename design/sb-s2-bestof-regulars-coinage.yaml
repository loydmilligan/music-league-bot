  # ── The Cat Lobby ─────────────────────────────────────────────────────────
  # Returning regular — the season's only three-card player (r139, r140, r142).
  - name: Ailurophila sapiens
    player: Sarah Black
    type: single-issue advocacy office
    style: spotlight
    motif: three cards, one platform, zero concessions
    note: >
      An ailurophile is a lover of cats; the card's name is the subspecies —
      Ailurophila sapiens, the human who prefers the other species to her
      own. The season's longest-running institution. Founded in the chat,
      ignored by the humans, ignored by the digest, and — by its own formal
      complaint — ignored by the AI that is literally tasked with summarizing
      the chat.
      Its year in review: a constituency welcomed and purged inside a single
      hour; a takedown notice served on the one man who had posted nothing
      cat-related; an apology received for a post that did not exist. The
      Lobby ends the season holding a judicial record, a propaganda ministry
      (see: the Coinage), and an opposition archive maintained by the other
      Chapin. It does not rest.
    spotlight:
      text: I was going to formally welcome you to the cat lobby but now you're 86ed like JAC
      caption: membership revoked eleven minutes after it was offered · aug 19
    evidence:
      - I would like to formally note that I have made multiple attempts to steer this group chat toward more important topics (specifically dogs and cats) and yet - neither the group nor the digest has seen fit to acknowledge my campaign. I'm not sure which is more offensive: being repeatedly ignored by my fellow humans, or being ignored by the AI that is literally tasked with summarizing the chat.
      - I asked for this chat to have more talk about cats, not pussy
      - Welcome to the constituency. The cat lobby thanks you.
      - That's right Phil, you better delete any message that bedowngrades cat related content
      - Sarah S. was competing with Sarah Z. for Miss Congeniality until Sarah S. had to lay the smack down on Phil for an anti-cat post.  Didn't even offer an apology.
      - JB still hasn't unpacked his suitcase from a trip that ended 2 weeks ago, because the cats like to sit in it.
    highlight: [constituency, 86ed, bedowngrades]
