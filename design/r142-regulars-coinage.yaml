# content for The Regulars + The Coinage.
#
# Written straight into digest_sections.content_json (draft-142-1e2d7d0a-storylines)
# and digest_drafts.stats_content_json. Generation SKIPS storylines for this
# league (settings.storylines_section_leagues = {"sssc":true}), so a full regen
# drops it — re-apply from this file. Same shape as design/r148-regulars-coinage.yaml.
#
# EVERY quote below is verbatim from chat_messages in group "Music League chat
# for Second Best and Friends" over the round window 2026-08-30 → 2026-09-06.
# Counts were computed against data/league.db, not estimated.
#
# DEDUPE RULE APPLIED: nothing here repeats a quote already used by the podium,
# villain, flow, consensus, quotes or chat sections of this draft. Specifically
# avoided, because chat already owns them: Tj's "shark wearing glasses" downvote
