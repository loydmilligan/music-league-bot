title: The Regulars
cast:
  # ── The Alternate Take ─────────────────────────────────────────────────────
  # 15 distinct music.youtube.com posts across the league's history (verified:
  # count(distinct ts) where sender='Mara Mariani' and text like '%music.youtube%').
  # In this round the mirror carried the songs she DIDN'T submit.
  - name: The Alternate Take
    player: Mara Mariani
    type: catchphrase-holder
    style: quote-led
    motif: the song she almost picked
    note: >
      Mara mirrors everything to YouTube Music for the non-Spotify half of the
      league — fifteen drops and counting. This round the mirror carried the
      songs she left at home: the near-misses, posted with her reasoning
      attached, four days before she took bronze and stayed top of the season
      table. Nobody else shows their working.
    evidence:
      - "Almost submitted this but wasn't sure the non lexical was heavily featured enough"
      - "Or this one"
    highlight:
      - Almost submitted this
      - Or this one

  # ── The Cat Lobby ──────────────────────────────────────────────────────────
  # Established regular (see the relationship context: "ignored by humans AND
  # the AI"). This round the complaint finally got filed against the digest
  # itself, four days before she downvoted the round's most divisive song.
  - name: The Cat Lobby
    player: Sarah Black
    type: catchphrase-holder
    style: spotlight
    motif: single-issue, permanently unsatisfied
    note: >
      The Cat Lobby has spent a season being ignored by the humans. This round
      it opened a second front and came for the digest.
    spotlight:
      text: Though mine makes no mention of cats so I think the context needs an update
      caption: filing a complaint against her own dossier · aug 30
    evidence:
      - "That’s right Phil, you better delete any message that bedowngrades cat related content"
    highlight:
      - no mention of cats
      - cat related content

  # ── The Vote Regretter ─────────────────────────────────────────────────────
  # All five lines land inside 15 minutes on 2026-09-02 (18:02–18:21 PDT), after
  # his ballot was already filed, plus one next-day apology. He was the round's
  # single biggest voter on Sweat (5 pts) and whoa (5 pts).
  - name: The Vote Regretter
    player: Tj Cook
    type: catchphrase-holder
    style: quote-led
    motif: files fast, revises forever
    note: >
      Tj votes at speed and then spends the rest of the week relitigating it in
      public — not with the commissioner, who could actually change something,
      but with the room. Every line below arrived after his ballot was locked.
      He apologised to the wrong person about a song he had not downvoted.
    evidence:
      - "I sling votes around like monopoly money."
      - "If I could go back."
      - "I may need my votes back. This sounds like force inner circle."
      - "And I didn't downvote."
      - "Sorry. Thought you posted Runaround Sue. I may have voted for ya."
    highlight:
      - monopoly money
      - go back
      - need my votes back

note: >
  a regular only turns up here when this round's chat backs the bit with a real
  quote — no quote that round, they sit it out. every line above is verbatim.

stats:
  phrase:
    style: dictionary
    term: all JB about it
    pronunciation: /ɔːl dʒeɪ ˈbiː əˌbaʊt ɪt/
    part_of_speech: adjectival phrase · league-internal
    definition: >
      First recorded this week — and nobody had to ask. That is the tell of a real
      coinage: it arrives fully formed, and the whole league knows what it means the
      moment it is said.


      To be all JB about it is to concede that the playlist is good and then raise the
      point of order anyway; to accept the spirit of a theme while filing a written
      objection to the letter of it; to award zero points with a paragraph attached,
      disqualifying a song on a technicality of your own devising.


      And who better to coin it than JB's (much) better half.

    coined:
      by: Sarah Black
      context: >
        posted to the group four days into voting, immediately after conceding
        the playlist was good — the disclaimer arriving, as it must, in the same
        breath as the pedantry it disclaims
      date: '2026-09-02'
    stats:
      uses: 1
      speakers: 1
      prior_rounds: 0
    usages:
      - label: the first recorded use
        speaker: Sarah Black
        text: Good playlist but I’m wondering if we are all on the same page about what a non-lexical vocable actually is. Not to be all JB about the theme.
