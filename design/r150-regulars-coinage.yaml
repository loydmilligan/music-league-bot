# R150 (boarz-ii-men) — hand-authored Regulars + Coinage, punch-up 2026-09-10.
# storylines:
  title: The Usual Suspects
  cast:
  - name: The Socratic Method
    player: Dave Steingart
    type: one-question philosopher
    style: quote-led
    motif: asks the reasonable thing, then leaves
    note: 'Socrates asked questions until his interlocutor arrived somewhere. Steingart asks
      one and goes to bed. He posted thirteen messages this week in exactly two clusters,
      and both times the question was the reasonable one nobody else had put — first at the
      Acura truck, then, two nights later, at the round itself. The second turned Jensen''s
      grumble about the playlist into the only real argument anyone had about this round.
      He took no further part in it.

      '
    evidence:
    - Why would you do this
    - I have a truck and it’s pretty great. It’s just a normal truck though, not some frankstein
      monstrosity
    - Maybe just me, but I feel like the novelty and lolz might wear off quick and then you
      are left with that thing
    - Got it, that makes more sense
    - Do you prefer good songs off theme or bad songs on theme
    highlight:
    - Why would you do this
    - Do you prefer good songs off theme or bad songs on theme
    - Got it, that makes more sense
    stats:
    - value: '13'
      label: messages all week, in two sittings
    - value: '2'
      label: arguments started, neither joined
  - name: The Musical Adult Groomer
    player: Jon Black
    type: troop hygienist
    style: quote-led
    motif: picks the nits, every song, every round
    note: 'In a troop, grooming is the bond: one animal picks the parasites out of another''s
      coat and both are calmer for it. The word for the tedious part of that work is nitpicking.
      Eight of Jon Black''s nine ballot comments this round ruled on moshability and on nothing
      else. The ninth was about puppies, and he attacked that on separate grounds. Seventy-three
      ballot comments this season, more than anyone in the league. It is how he says he loves
      them.

      '
    evidence:
    - Not sure that this song is moshable.  Their bass player is good, though.
    - Not a good song and not really moshable.
    - Not sure if you can really mosh to any hip-hop songs.
    - Can you mosh to a NOFX song?  What a silly question.
    - Moshable, but I'm not too in to this song.
    highlight:
    - moshable
    - mosh
    - Moshable
    stats:
    - value: 8/9
      label: ballots ruled on moshability
    - value: '73'
      label: ballot comments this season, most in the league
  note: ''

