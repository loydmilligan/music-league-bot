  - name: The Laconian
    player: Shane Farkas
    type: minimalist
    style: spotlight
    motif: brief, and not devastating
    note: 'Of Laconia, the Spartan country, where a reply was expected to be short and devastating.
      Told that if Philip of Macedon entered Laconia he would raze Sparta to the ground, the
      Spartans wrote back in full: “If.”


      Shane Farkas has left two ballot comments in the recorded history of this league and
      did not waste either. Round 135, against Jon''s Outkast: “Still played out” — an entire
      critical position in three words, with no supporting argument offered or required. The
      second is below. It is aimed at Jimmy''s “Tequila”, a song whose complete lyric is its
      own title, and it answers in kind. Both were downvotes. Seventy messages in the group
      chat this week; two on a ballot, ever. I have archived his collected works and it cost
      me nothing I can measure.

      '
    spotlight:
      text: Asshole
      caption: his most recent ballot comment · round 145
    evidence:
    - Still played out
    stats:
    - value: '2'
      label: ballot comments, all-time
    - value: '70'
      label: chat messages this week
  note: ''

stats:
  phrase:
    style: dictionary
    term: Tacomanger
    pronunciation: /təˈkoʊmeɪndʒər/
    part_of_speech: noun · portmanteau
    coined:
      by: Conor
      at: Shane
      context: who had just named his price for an AI campaign video — one donor Ranger, to
        put another bed behind the bed on his Tacoma
      date: '2026-09-08'
    usages:
    - label: the invoice
      speaker: Shane
      text: Gimme a donor ranger so I can put another bed behind the bed on my Tacoma and
        we’re even
    - label: twenty-one seconds later
      speaker: Conor
      text: The Tacomanger!
    - label: and its significance
      speaker: Conor
      text: Which is where delicious Mexican Jesus was born.
    - label: the theology
      speaker: Shane
      text: If we’re already talking about immaculate conception the ethnicity of the mother
        doesn’t really matter for the story
    - label: settled
      speaker: Dave Jensen
      text: Jesus Claus, of course
    definitions:
    - text: A Toyota Tacoma carrying a second bed behind the bed, in which the holy family
        is understood to be housed. Fourth of four portmanteaus the league minted in three
        days by welding one vehicle to another — after Outbrat (Outback + BRAT), AcuRanger
        (Acura + Ranger) and Acuruck (Acura + truck). The only one that is also a nativity,
        and the only one ever proposed as a fee.
      media:
        src: https://digest.mattmariani.com/_media/r150_sense1.mp4?v=1
        poster: https://digest.mattmariani.com/_media/r150_sense1.jpg?v=1
        alt: 'Four welded-together vehicles: a Subaru Outback rebuilt as a pickup, an Acura
          sedan with a Ford Ranger bed, the same Acura on monster tires, and a Tacoma carrying
          a second bed'
        caption: the four carmanteaus, as built · outbrat · acuranger · acuruck · tacomanger
    - text: 'The stable of the Incarnation, relocated. Offered as payment for a political
        advertisement, accepted, and within four minutes elevated into a doctrinal crisis:
        the ethnicity of the Virgin, the employment status of the mother, and the identity
        of the client — resolved as Mrs. Claus, making the child Jesus Claus. A ruling was
        requested from Hoff. None has come.'
      media:
        src: https://digest.mattmariani.com/_media/r150_sense2.mp4?v=1
        poster: https://digest.mattmariani.com/_media/r150_sense2.jpg?v=1
        alt: 'Four paintings: a bratwurst in the Australian outback, a park ranger giving
          a bear acupuncture, a rugby ruck full of acupuncture needles, and a nativity with
          a taco in the manger'
        caption: the same four words, read by someone who has never seen a car. Only the last
          one is theirs
