<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>music-league-bot — Content screen · visual target</title>

  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="orc-tower-styles.css">
  <link rel="stylesheet" href="ml-styles.css">
  <link rel="stylesheet" href="ml-digest-styles.css">
  <link rel="stylesheet" href="ml-content-styles.css">

  <link rel="icon" type="image/png" sizes="32x32" href="m-l-favicon-32x32.png">
  <meta name="theme-color" content="#07090c">

  <style>
    html, body { background: #f0eee9; margin: 0; padding: 0; }
    [data-dc-artboard-id] .ml-app { width: 100%; min-height: 100%; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ml-data.jsx"></script>
  <script type="text/babel" src="ml-shared.jsx"></script>
  <script type="text/babel" src="ml-digest-data.jsx"></script>
  <script type="text/babel" src="ml-digest-refine.jsx"></script>
  <script type="text/babel" src="ml-content-data.jsx"></script>
  <script type="text/babel" src="ml-content.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <DesignCanvas
          title="music-league-bot · Content screen — operator side of the b-side"
          subtitle="The sidebar's 'Digest' becomes 'Content', split into two tabs. Digest is the existing generate→refine→finalize pipeline. Archive manages each league's shareable b-side: publish a first site, or add a finalized round to the archive — always on the same unguessable slug. An 'update ready' badge appears whenever a new digest is waiting to be archived."
        >
          <DCSection id="archive" title="Archive tab — one b-side per league, update-ready badges"
            subtitle="The default Archive view. Two leagues have a finalized digest waiting to be added (pulp 'update ready' rows); one is up to date (voting still open); one has never been published. The Archive tab carries a count badge matching the number of pending updates.">
            <DCArtboard id="ct-archive" label="Content · Archive tab · league list" width={1360} height={900}>
              <ContentScreen tab="archive" />
            </DCArtboard>
          </DCSection>

          <DCSection id="update" title="Archive-update modal — decide what recomputes"
            subtitle="Opens from 'Update archive →'. One required 'add to timeline' entry plus the recomputed sections (superlatives, stats, fingerprints, moments, overlap). Each recompute row is a refresh / hold / lock decision; steerable rewrites get a regen affordance. Announce choice + the same-slug guarantee sit at the bottom.">
            <DCArtboard id="ct-update" label="Content · Archive tab · update modal open" width={1360} height={1140}>
              <ContentScreen tab="archive" modal />
            </DCArtboard>
          </DCSection>

          <DCSection id="published" title="Published — reshare the update"
            subtitle="After Generate: the round is live in the archive on the same link, and a reshare card is ready for the family chat so everyone knows a new digest landed. Send to WhatsApp, copy the card, or copy the link only.">
            <DCArtboard id="ct-published" label="Content · Archive tab · published + reshare" width={1360} height={760}>
              <ContentScreen tab="archive" published />
            </DCArtboard>
          </DCSection>

          <DCSection id="digest" title="Digest tab — the existing pipeline, unchanged"
            subtitle="The other tab. Generate → refine → finalize this round's shareable digest, exactly as today. Finalizing here is what makes a round available to add on the Archive tab.">
            <DCArtboard id="ct-digest" label="Content · Digest tab" width={1360} height={720}>
              <ContentScreen tab="digest" />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
