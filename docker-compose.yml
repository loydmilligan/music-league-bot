services:
  bot:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./.wwebjs_auth:/app/.wwebjs_auth
      - ./.wwebjs_cache:/app/.wwebjs_cache
    restart: unless-stopped

  api:
    build: .
    command: npm run api
    env_file: .env
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  bot-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - DIGESTS_DIR=/app/digests
      - ML_AUTH_TRIGGER_URL=http://host.docker.internal:7679
      # adapter-node defaults the request body cap to 512K, which rejected ~1.4MB
      # avatar uploads before the endpoint's own 5MB check ran (request.formData()
      # threw "failed to parse multipart form data"). 6M = 5MB cap + multipart overhead.
      - BODY_SIZE_LIMIT=6M
    extra_hosts:
      # Lets the container reach host-side daemons (e.g. the ML auth trigger
      # on localhost:7679) via host.docker.internal.
      - "host.docker.internal:host-gateway"
    ports:
      - "3002:3002"
    volumes:
      - ./data:/app/data
      # Shared digests/ volume — bot-ui WRITES rendered html-share artifacts here
      # (sprint-20 render-pipeline); digest-static serves the same dir read-only.
      - ./digests:/app/digests
      # sintel audio analysis — host project + uv binary are available in the
      # runtime image; this mount gives the container the source + pyproject.toml.
      - /home/loydmilligan/Projects/sintel:/home/loydmilligan/Projects/sintel
      # Isolated venv for sintel inside the container (named volume so it persists
      # across recreates and never clobbers the host's .venv).
      - sintel_venv:/app/sintel-venv
    restart: unless-stopped

  # Static-only public file server for the shared digests/ volume (sprint-20).
  # No app, no DB, no Cloudflare Access. Fronted by a SEPARATE public Cloudflare
  # tunnel → digest.mattmariani.com (created by the user). Serves the
  # folder-per-slug artifacts at /d/<slug>/ (index.html per the packaging-spike).
  digest-static:
    image: caddy:2-alpine
    volumes:
      - ./digests:/srv/digests:ro
      - ./Caddyfile.digest:/etc/caddy/Caddyfile:ro
    ports:
      # host:container — host port is what the cloudflared ingress targets.
      - "8088:8080"
    restart: unless-stopped

volumes:
  sintel_venv:
