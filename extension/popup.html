<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MLB</title>
    <style>
      :root {
        --bg: #121212;
        --panel: #1c1c1c;
        --fg: #f5f5f5;
        --muted: #a7a7a7;
        --border: #2a2a2a;
        --accent: #1db954;
        --accent-fg: #000;
        --danger: #f87171;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        width: 320px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 system-ui, -apple-system, "Inter", "Segoe UI", sans-serif;
      }
      .pad { padding: 14px 16px; }
      .row { display: flex; align-items: center; gap: 8px; }
      .between { justify-content: space-between; }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      .brand { font-weight: 700; letter-spacing: 0.04em; }
      .iconbtn {
        background: transparent;
        border: 0;
        color: var(--muted);
        cursor: pointer;
        font-size: 16px;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .iconbtn:hover { color: var(--fg); background: var(--panel); }
      .badge {
        display: inline-block;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: var(--panel);
        color: var(--muted);
        padding: 3px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
      }
      .badge.kind-track { color: #93c5fd; border-color: #1e3a8a; }
      .badge.kind-album { color: #fcd34d; border-color: #78350f; }
      .badge.kind-playlist { color: #c4b5fd; border-color: #4c1d95; }
      .title {
        font-size: 15px;
        font-weight: 600;
        margin: 10px 0 2px;
        word-break: break-word;
      }
      .sub { color: var(--muted); font-size: 12px; }
      .muted { color: var(--muted); }
      .actions { display: flex; gap: 8px; margin-top: 14px; }
      button {
        background: var(--accent);
        color: var(--accent-fg);
        border: 0;
        border-radius: 999px;
        padding: 8px 16px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        flex: 1;
      }
      button.secondary {
        background: transparent;
        color: var(--fg);
        border: 1px solid var(--border);
        flex: 0 0 auto;
      }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .empty { color: var(--muted); padding: 20px 16px; text-align: center; }
      .empty a { color: var(--accent); cursor: pointer; }
      .spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        vertical-align: -2px;
        margin-right: 6px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .result {
        margin-top: 12px;
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .result.ok { border-color: rgba(29, 185, 84, 0.4); }
      .result.err { border-color: rgba(248, 113, 113, 0.4); color: var(--danger); }
      .result ul { margin: 6px 0 0; padding-left: 18px; }
      .result li { color: var(--muted); font-size: 12px; }
      .result .more { color: var(--muted); font-size: 11px; margin-top: 4px; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">MLB</div>
      <button id="optsBtn" class="iconbtn" title="Options">⚙</button>
    </div>

    <div id="loading" class="empty"><span class="spinner"></span>Detecting…</div>

    <div id="unconfigured" class="empty hidden">
      No API token configured.<br />
      <a id="openOpts">Open options →</a>
    </div>

    <div id="notSpotify" class="empty hidden">
      Navigate to a Spotify track, album, or playlist page.
    </div>

    <div id="detected" class="pad hidden">
      <span id="kindBadge" class="badge"></span>
      <div id="title" class="title"></div>
      <div id="sub" class="sub"></div>
      <div class="actions">
        <button id="addBtn">Add to shortlist</button>
      </div>
      <div id="result" class="result hidden"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
