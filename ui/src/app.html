<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#07090c" />
		<link rel="icon" type="image/png" sizes="32x32" href="/m-l-favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="64x64" href="/m-l-favicon-64x64.png" />
		<link rel="icon" type="image/png" sizes="256x256" href="/m-l-favicon-256x256.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="/m-l-favicon-512x512.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/m-l-apple-touch-180.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Inter+Tight:ital,wght@0,300..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap"
		/>
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Inter+Tight:ital,wght@0,300..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-bg text-fg font-sans antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
