<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Boarz Tape</title>
<link rel="stylesheet" href="./_app/fonts.css">
<style>
/* fonts self-hosted — see ./_app/fonts.css linked in <head> */
:root{
  --mash-pulp:#ff5b2e;--mash-pulp-deep:#d94c23;--mash-pulp-edge:#8a2d15;--mash-pulp-soft:#ff5b2e22;
  --ink-0:#07090c;--ink-1:#0d1116;--ink-2:#141921;--ink-3:#1c232c;--ink-4:#283039;--ink-5:#3a4451;--ink-6:#5a6773;--ink-7:#8b97a4;--ink-8:#c2cad3;--ink-9:#f1f4f7;--bone:#faf7f2;
  --moss:#3ec27a;--amber:#e8a83a;--ember:#e6566c;--sky:#5aa3ff;
  --fg:var(--ink-9);--fg-2:var(--ink-8);--fg-muted:var(--ink-7);--fg-quiet:var(--ink-6);--line:var(--ink-4);
  --font-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter Tight",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease-out:cubic-bezier(0.2,0.7,0.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ink-0);color:var(--fg-2);font-family:var(--font-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--mash-pulp);text-decoration:none}
a:hover{color:var(--mash-pulp-deep)}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:0;height:0}
*{scrollbar-width:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--ink-0);position:relative;overflow:hidden}
.eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg-quiet)}
.acc-pulp{--acc:var(--mash-pulp)}.acc-amber{--acc:var(--amber)}.acc-sky{--acc:var(--sky)}.acc-moss{--acc:var(--moss)}.acc-ember{--acc:var(--ember)}.acc-ink{--acc:var(--ink-7)}
/* masthead */
.mast{padding:34px 22px 10px}
.mast .kick{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-quiet)}
.mast h1{font-family:var(--font-display);font-weight:800;font-size:38px;line-height:.98;letter-spacing:-.03em;color:var(--fg);margin:8px 0 0}
.mast h1 em{font-style:italic;color:var(--mash-pulp)}
.mast .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);margin-top:10px}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 22px 12px;position:sticky;top:0;z-index:30;background:linear-gradient(var(--ink-0) 74%,transparent)}
.tab{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:7px 13px;border-radius:999px;white-space:nowrap;flex:none;border:1px solid var(--ink-4);background:var(--ink-1);color:var(--fg-muted);transition:all .18s}
.tab.on{background:var(--mash-pulp);color:var(--bone);border-color:var(--mash-pulp);font-weight:700}
/* bento */
.bento{padding:2px 16px 60px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{grid-column:span 1;text-align:left;background:var(--ink-1);border:1px solid var(--ink-4);border-radius:12px;padding:13px 14px;min-height:118px;display:flex;flex-direction:column;transition:border-color .18s,transform .1s}
.tile.wide{grid-column:span 2}
.tile:active{transform:scale(.985)}
.tile:hover{border-color:var(--acc)}
.tile .th{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tile .ttag{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.tile .draft{font-family:var(--font-mono);font-size:7.5px;letter-spacing:.08em;color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:0 3px}
.tile .tname{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--fg);line-height:1.05;margin-top:7px}
.tile .tval{font-family:var(--font-display);font-weight:800;color:var(--acc);line-height:1;margin-top:auto;padding-top:10px}
.tile .tlabel{font-family:var(--font-mono);font-size:9.5px;color:var(--fg-muted);margin-top:3px;line-height:1.3}
/* overlay */
.ov{position:fixed;inset:0;max-width:480px;margin:0 auto;background:var(--ink-0);z-index:50;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s var(--ease-out);will-change:transform}
.ov.open{transform:translateX(0)}
.ov-top{padding:34px 20px 14px;border-bottom:1px solid var(--ink-4);display:flex;align-items:center;gap:12px;flex:none}
.ov-back{background:var(--ink-2);border:1px solid var(--ink-4);color:var(--fg);width:34px;height:34px;border-radius:999px;font-size:17px;flex:none;display:flex;align-items:center;justify-content:center}
.ov-top .otag{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.ov-top .oname{font-family:var(--font-display);font-weight:700;font-size:21px;color:var(--fg);line-height:1.05}
.ov-body{flex:1;overflow-y:auto;padding:18px 20px 60px}
.lead{font-size:14.5px;line-height:1.6;color:var(--fg-muted);margin:0 0 18px}
.lead b{color:var(--fg-2)}
/* generic bits */
.card{border:1px solid var(--ink-4);border-radius:12px;padding:15px 16px;background:var(--ink-1)}
.stack{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent);mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 16px),transparent)}
.chip{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:999px;white-space:nowrap;flex:none;border:1px solid var(--ink-4);background:var(--ink-1);color:var(--fg-muted);transition:all .16s}
.chip.on{background:var(--mash-pulp);color:var(--bone);border-color:var(--mash-pulp);font-weight:700}
.chip.on.sky{background:var(--sky);border-color:var(--sky);color:var(--ink-0)}
.bar{height:7px;background:var(--ink-3);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;transform-origin:left;animation:barIn .45s var(--ease-out)}
@keyframes barIn{from{transform:scaleX(0)}}
.quote{font-size:13px;line-height:1.55;color:var(--fg-2);border-left:2px solid var(--acc);padding-left:12px;font-style:italic}
.mono{font-family:var(--font-mono)}
.sub{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-quiet)}
/* award */
.award{border:1px solid var(--ink-4);border-radius:12px;padding:14px 15px;background:var(--ink-1);display:flex;flex-direction:column;gap:7px}
.award .an{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.award .aw{font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--fg);line-height:1.05}
.award .av{font-family:var(--font-mono);font-size:12px;color:var(--fg-2)}
.award .ac{font-size:13px;line-height:1.5;color:var(--fg-muted)}
/* rank row */
.rrow{padding:6px;border-radius:8px}
.rrow.sel{background:rgba(90,163,255,.08)}
.rrow .rh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;gap:10px}
.rrow .rn{display:flex;gap:8px;align-items:baseline;min-width:0}
.rrow .rk{font-family:var(--font-mono);font-size:10px;color:var(--fg-quiet);width:22px;flex:none}
.rrow .rname{font-size:13.5px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rv{font-family:var(--font-mono);font-size:12px;color:var(--fg-2);flex:none}
.youbox{padding:12px 14px;background:rgba(90,163,255,.08);border:1px solid var(--sky);border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.youbox .yl{font-size:13px;color:var(--fg-2)}
.youbox .yl b{color:var(--sky)}
.youbox .yr{font-family:var(--font-display);font-weight:800;font-size:24px;color:var(--sky)}
/* heatmap */
.hm{display:grid;grid-template-columns:22px repeat(24,1fr);gap:2px;margin-top:6px}
.hm .hcell{aspect-ratio:1;border-radius:2px;background:var(--ink-2)}
.hm .hday{font-family:var(--font-mono);font-size:9px;color:var(--fg-quiet);display:flex;align-items:center}
.hm .hhr{font-family:var(--font-mono);font-size:7px;color:var(--fg-quiet);text-align:center}
/* accordion */
.acc{border:1px solid var(--ink-4);border-radius:12px;overflow:hidden;background:var(--ink-1)}
.acc>button{width:100%;text-align:left;background:none;border:none;padding:13px 15px;display:flex;align-items:center;gap:11px}
.av{width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:14px;color:var(--ink-0);flex:none}
.acc .amid{flex:1;min-width:0}
.acc .aname{font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--fg)}
.acc .acount{font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);margin-top:2px;display:block}
.chev{font-family:var(--font-mono);font-size:15px;color:var(--fg-quiet);transition:transform .2s}
.acc-body{padding:0 15px 13px;display:flex;flex-direction:column;gap:12px}
.entry{border-top:1px solid var(--ink-3);padding-top:11px;display:flex;flex-direction:column;gap:7px}
.entry .earch{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--acc)}
.entry .emotif{font-family:var(--font-mono);font-size:10px;color:var(--fg-quiet)}
.entry .enote{font-size:13px;line-height:1.55;color:var(--fg-2)}
.spot{background:var(--acc);color:var(--ink-0);border-radius:10px;padding:12px 14px}
.spot .st{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1}
.spot .sc{font-family:var(--font-mono);font-size:10px;margin-top:5px;opacity:.85}
.tok{display:inline-block;font-family:var(--font-mono);font-size:11px;color:var(--acc);border:1px solid var(--acc);border-radius:6px;padding:2px 8px;align-self:flex-start}
.pairs{display:flex;flex-direction:column;gap:4px}
.pair{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--ink-3)}
.pair .pr{color:var(--fg-muted)}.pair .pa{color:var(--fg);font-weight:600}
/* glossary */
.gl{border:1px solid var(--ink-4);border-radius:12px;padding:16px 17px;background:var(--ink-1);display:flex;flex-direction:column;gap:10px}
.gl .gterm{font-family:var(--font-display);font-weight:800;font-size:23px;color:var(--fg);line-height:1}
.gl .gpron{font-family:var(--font-mono);font-size:11px;color:var(--fg-muted);margin-top:3px}
.gl .gpos{font-family:var(--font-mono);font-style:italic;font-size:11px;color:var(--moss)}
.gl .gdef{font-size:14px;line-height:1.62;color:var(--fg-2);white-space:pre-wrap}
.gl .gcoin{font-family:var(--font-mono);font-size:10px;letter-spacing:.03em;color:var(--fg-quiet);border-top:1px solid var(--ink-3);padding-top:9px;line-height:1.5}
.gl .gsrc{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--moss);border:1px solid var(--moss);border-radius:4px;padding:1px 5px;align-self:flex-start}
.usage{display:flex;flex-direction:column;gap:3px}
.usage .ul{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-quiet)}
.usage .ut{font-size:13px;line-height:1.5;color:var(--fg-2);border-left:2px solid var(--moss);padding-left:11px}
.usage .ut b{color:var(--fg);font-weight:600}
/* songs */
.podium{background:var(--ink-1);border:1px solid var(--amber);border-radius:12px;padding:14px 15px;margin-bottom:14px}
.podium .ph{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin-bottom:10px}
.prow{display:flex;align-items:center;gap:11px;padding:6px 0}
.prow .pl{font-family:var(--font-display);font-weight:800;font-size:20px;width:24px;flex:none;text-align:center}
.prow .pmid{flex:1;min-width:0}
.prow .pt{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--fg);line-height:1.15}
.prow .pa{font-size:12px;color:var(--fg-muted);display:block}
.prow .pv{font-family:var(--font-mono);font-size:11px;color:var(--fg-quiet);text-align:right;flex:none}
.prow .part{width:36px;height:36px;border-radius:6px;object-fit:cover;flex:none;background:var(--ink-2)}
.trow{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--ink-3)}
.trow .tart{width:34px;height:34px;border-radius:6px;object-fit:cover;flex:none;background:var(--ink-2)}
.trow:last-child{border-bottom:none}
.racc .rbadge{width:34px;flex:none;text-align:center;font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--mash-pulp)}
.trow .tn{font-family:var(--font-mono);font-size:11px;color:var(--fg-quiet);width:26px;flex:none;padding-top:2px}
.trow .tmid{flex:1;min-width:0}
.trow .tt{font-family:var(--font-body);font-weight:600;font-size:14px;color:var(--fg);line-height:1.2}
.trow .ta{font-size:12px;color:var(--fg-muted);display:block}
.trow .tby{font-family:var(--font-mono);font-size:9.5px;color:var(--acc);margin-top:2px;display:block}
.plbtn{display:block;text-align:center;background:var(--moss);color:var(--ink-0);font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:12px;border-radius:10px;margin:6px 0 16px}
.note{font-size:13.5px;line-height:1.62;color:var(--fg-2);padding:12px 0;border-bottom:1px solid var(--ink-3)}
.note:before{content:"§";color:var(--fg-quiet);font-family:var(--font-mono);margin-right:8px}
.foot{padding:26px 22px 60px;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--fg-quiet);line-height:1.7}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="mast">
    <div class="kick">Chat Superlatives · 47 days, counted</div>
    <h1>The Boarz <em>Tape</em></h1>
    <div class="meta" id="mast-meta"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="bento" id="bento"></div>
  <div class="foot">Built from <span id="foot-msgs"></span> messages · one static file · b/side · Mash Co.</div>
</div>
<div class="ov" id="ov"><div class="ov-top" id="ov-top"></div><div class="ov-body" id="ov-body"></div></div>

<script id="tape-data" type="application/json">__DATA__</script>
<script>
"use strict";
const TAPE = JSON.parse(document.getElementById('tape-data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const nf = n => Number(n).toLocaleString('en-US');
const accVar = a => ({pulp:'var(--mash-pulp)',amber:'var(--amber)',sky:'var(--sky)',moss:'var(--moss)',ember:'var(--ember)',ink:'var(--ink-7)'}[a]||'var(--mash-pulp)');

/* ---- section registry (locked design: tabs+bento home, pivots, accordion regulars, full-card glossary, podium+rounds tracks) ---- */
const SIDES = ['Overview','Side A','Side B','Regulars','Tracks'];
const SECTIONS = [
  {id:'seasonReview',side:'Side A',   tag:'Season so far',     name:'The Carrot Box',       acc:'ember', draft:TAPE.editorial.draft, val:()=>String(TAPE.editorial.seasonReview.rounds.length), label:'rounds reviewed · one long con', valSize:'34px'},
  {id:'awards',      side:'Side A',   tag:'Every winner',      name:'The Full Roll',        acc:'pulp',  val:()=>String(Object.keys(TAPE.awards).length), label:'awards handed out', valSize:'34px'},
  {id:'biggestWord', side:'Side A',   tag:'Longest word',      name:'The Biggest Word',     acc:'amber', val:()=>'18', label:'letters · compartmentalizing', valSize:'34px'},
  {id:'allTalk',     side:'Side A',   tag:'Chat vs ballots',   name:'All Talk, No Ballot',  acc:'amber', val:()=>'1175:1', label:'Shane Farkas', valSize:'26px'},
  {id:'guessLedger', side:'Side A',   tag:'The guessing game', name:'Who Submitted What',   acc:'amber', draft:TAPE.editorial.draft, val:()=>'5/18', label:'guesses landed · scored vs the reveal', valSize:'30px'},
  {id:'motormouth',  side:'Side B',   tag:'Volume',            name:'Motormouth',           acc:'pulp',  val:()=>nf(topPerson('messages').messages), label:'messages · Matt Mariani', valSize:'28px'},
  {id:'mixingBoard', side:'Side B',   tag:'Find yourself',     name:'The Mixing Board',     acc:'sky',   val:()=>'▤', label:'every stat, one board', valSize:'26px'},
  {id:'heatmap',     side:'Side B',   tag:'Filter by person',  name:'When The Boarz Post',  acc:'sky',   val:()=>'▦', label:'day × hour', valSize:'26px'},
  {id:'readTheRoom', side:'Side B',   tag:'Mid-round culture check', name:'Read The Room',  acc:'sky',   val:()=>TAPE.votingHabits?nf(TAPE.votingHabits.pairwiseSeason.reduce((s,p)=>s+p.ballotCount,0)):'—', label:'ballots, mapped · who loves who', valSize:'28px'},
  {id:'regulars',    side:'Regulars', tag:'Recurring behavior',name:'The Regulars',         acc:'moss',  draft:TAPE.editorial.draft, val:()=>String(regCount()), label:'fingerprints · 10 players', valSize:'34px'},
  {id:'glossary',    side:'Regulars', tag:'League language',    name:'The Glossary',         acc:'moss',  draft:TAPE.editorial.draft, val:()=>String(TAPE.editorial.glossary.length), label:'coinages, kept forever', valSize:'34px'},
  {id:'songs',       side:'Tracks',   tag:'Every song shared',  name:'The Track List',       acc:'pulp',  val:()=>String(TAPE.songs.links.length), label:'tracks · one playlist', valSize:'30px'},
  {id:'method',      side:'Tracks',   tag:'Methodology',        name:'How This Was Counted', acc:'ink',   val:()=>'§', label:'caveats & definitions', valSize:'26px'},
];
const AWARD_TITLES = {motormouth:'Motormouth',lurker:'The Lurker',vocabulary:'The Vocabulary',variety:'The Variety',biggestWord:'The Biggest Word',professor:'The Professor',simplest:'The Simplest',linguist:'The Linguist',wordsmith:'The Wordsmith',perfectionist:'The Perfectionist',explicit:'Most Explicit',allTalk:'All Talk, No Ballot',nightOwl:'The Night Owl',rambler:'The Rambler',linker:'The Linker',emoji:'Most Emoji',fastest:'Quickest Draw'};
const AWARD_ACC = {motormouth:'pulp',lurker:'ink',vocabulary:'sky',variety:'sky',biggestWord:'amber',professor:'sky',simplest:'moss',linguist:'sky',wordsmith:'amber',perfectionist:'amber',explicit:'ember',allTalk:'amber',nightOwl:'sky',rambler:'pulp',linker:'moss',emoji:'pulp',fastest:'moss'};
const PCOLOR = {'Matt Mariani':'var(--mash-pulp)','Jon Black':'var(--sky)','Conor Johnston':'var(--ember)','Grant Koziol':'var(--moss)','Dave Jensen':'var(--sky)','Shane Farkas':'var(--amber)','Clements Johnson':'var(--moss)','Jimmy':'var(--ink-7)','Dave Steingart':'var(--amber)','Darren Pallets':'var(--ink-6)'};
const REG_FULLNAME = {Matt:'Matt Mariani',JB:'Jon Black',Grant:'Grant Koziol',Conor:'Conor Johnston',Jensen:'Dave Jensen',Shane:'Shane Farkas',Jimmy:'Jimmy',Steiny:'Dave Steingart',Darren:'Darren Pallets',Clements:'Clements Johnson'};
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function topPerson(k){return TAPE.people.slice().sort((a,b)=>b[k]-a[k])[0];}
function regCount(){return TAPE.editorial.regulars.reduce((n,p)=>n+p.entries.length,0);}
function initials(name){return name.split(' ').map(w=>w[0]).join('').slice(0,2);}
function pcolor(name){return PCOLOR[name]||'var(--ink-7)';}

/* ---- Read The Room: OKLCH color + 4 SVG builders, ported from CD's handoff ---- */
function rtrCol(h,l=0.72,c=0.15){ return `oklch(${l} ${c} ${h})`; }

function rtrWeb(vh, sel){
  const roster = vh.roster, N = roster.length;
  const idxByName = new Map(roster.map((r,i)=>[r.name,i]));
  const W=1080,H=1180, cx=540,cy=650,rad=392;
  const pos = roster.map((m,i)=>{ const a=-Math.PI/2+i*(2*Math.PI/N); return {x:cx+rad*Math.cos(a), y:cy+rad*Math.sin(a), a, m}; });
  const fav=[];
  roster.forEach((m,i)=>{
    const top = vh.pairwiseSeason.filter(p=>p.from===m.name).sort((a,b)=>b.netPoints-a.netPoints)[0];
    if(top && top.netPoints>0) fav.push({i, j:idxByName.get(top.to), net:top.netPoints});
  });
  const beef = vh.pairwiseSeason.filter(p=>p.netPoints<=-1).map(p=>({i:idxByName.get(p.from), j:idxByName.get(p.to)}));
  const rel = (i,j)=> sel===null || i===sel || j===sel;
  const dimE = (on)=> sel===null?1:(on?1:0.1);
  const curve=(p,q,k)=>{ const mx=(p.x+q.x)/2, my=(p.y+q.y)/2; const kx=mx+(cx-mx)*k, ky=my+(cy-my)*k; return {d:`M ${p.x.toFixed(1)} ${p.y.toFixed(1)} Q ${kx.toFixed(1)} ${ky.toFixed(1)} ${q.x.toFixed(1)} ${q.y.toFixed(1)}`, kx, ky}; };
  const ptAt=(p,q,kx,ky,t)=>{ const it=1-t; return {x:it*it*p.x+2*it*t*kx+t*t*q.x, y:it*it*p.y+2*it*t*ky+t*t*q.y}; };

  const beefPaths = beef.map(b=>{ const c=curve(pos[b.i],pos[b.j],0.28);
    return `<path d="${c.d}" fill="none" stroke="#5aa3ff" stroke-width="2.5" stroke-opacity="${(0.5*dimE(rel(b.i,b.j))).toFixed(2)}" stroke-dasharray="3 9" stroke-linecap="round"><title>${esc(roster[b.i].first)} has beef with ${esc(roster[b.j].first)} (net-negative)</title></path>`; }).join('');
  const favGlow = fav.map(f=>{ const c=curve(pos[f.i],pos[f.j],0.5); const w=4+(f.net/12)*16; const o=dimE(rel(f.i,f.j));
    return `<path d="${c.d}" fill="none" stroke="${rtrCol(roster[f.i].hue,0.78,0.17)}" stroke-width="${(w+10).toFixed(1)}" stroke-opacity="${(0.1*o).toFixed(2)}" stroke-linecap="round"/>`; }).join('');
  const favCore = fav.map(f=>{ const c=curve(pos[f.i],pos[f.j],0.5); const w=4+(f.net/12)*16; const o=dimE(rel(f.i,f.j));
    return `<path d="${c.d}" fill="none" stroke="${rtrCol(roster[f.i].hue,0.8,0.18)}" stroke-width="${w.toFixed(1)}" stroke-opacity="${(0.92*o).toFixed(2)}" stroke-linecap="round" filter="url(#rtr-w-glow)"><title>${esc(roster[f.i].first)} carries ${esc(roster[f.j].first)} hardest (+${f.net} net points)</title></path>`; }).join('');
  const favDots = fav.map(f=>{ const c=curve(pos[f.i],pos[f.j],0.5); const pt=ptAt(pos[f.i],pos[f.j],c.kx,c.ky,0.8);
    return `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="7" fill="${rtrCol(roster[f.i].hue,0.9,0.15)}" fill-opacity="${dimE(rel(f.i,f.j)).toFixed(2)}"/>`; }).join('');
  const nodes = pos.map((p,i)=>{ const isSel=i===sel; const o=sel===null?1:(isSel?1:0.28);
    const ring = isSel? `<circle cx="${p.x}" cy="${p.y}" r="56" fill="none" stroke="${rtrCol(p.m.hue)}" stroke-width="2" stroke-opacity="0.6"/>` : '';
    return `${ring}<circle cx="${p.x}" cy="${p.y}" r="34" fill="${rtrCol(p.m.hue,0.55,0.13)}" stroke="${rtrCol(p.m.hue)}" stroke-width="${isSel?4:2.5}" fill-opacity="${o}" stroke-opacity="${o}"><title>${esc(p.m.name)}</title></circle>`; }).join('');
  const labels = pos.map((p,i)=>{ const isSel=i===sel; const o=sel===null?1:(isSel?1:0.4);
    const dx=Math.cos(p.a), dy=Math.sin(p.a); const lx=cx+(rad+50)*dx, ly=cy+(rad+50)*dy;
    const anchor = dx>0.25?'start':(dx<-0.25?'end':'middle');
    return `<text x="${lx.toFixed(1)}" y="${(ly+6).toFixed(1)}" text-anchor="${anchor}" fill="${isSel?rtrCol(p.m.hue,0.92,0.08):'#c2cad3'}" font-family="'Inter Tight',sans-serif" font-size="26" font-weight="${isSel?800:600}" opacity="${o}">${esc(p.m.first)}</text>`; }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <defs><radialGradient id="rtr-w-bg" cx="50%" cy="52%" r="62%"><stop offset="0%" stop-color="#0f1524"/><stop offset="100%" stop-color="#050608"/></radialGradient>
    <filter id="rtr-w-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <rect width="${W}" height="${H}" fill="url(#rtr-w-bg)"/>
    ${beefPaths}${favGlow}${favCore}${favDots}${nodes}${labels}
    <text x="${cx}" y="${H-40}" text-anchor="middle" fill="#5a6773" font-family="'JetBrains Mono',monospace" font-size="22" letter-spacing="4">BOARZ II MEN</text>
  </svg>`;
}

function rtrOrbit(vh, sel){
  const roster = vh.roster;
  const idxByName = new Map(roster.map((r,i)=>[r.name,i]));
  const heroDefault = roster.findIndex(r=>r.name==='Matt Mariani');
  const hero = sel===null? (heroDefault<0?0:heroDefault) : sel;
  const isExample = sel===null;
  const W=1080,H=1180, cx=540, cy=640, hue=roster[hero].hue;
  const incoming = vh.pairwiseSeason.filter(p=>p.to===roster[hero].name)
    .map(p=>({i:idxByName.get(p.from), lean:p.leanScorePerBallot??0, ballots:p.ballotCount}))
    .sort((a,b)=>b.lean-a.lean);
  const rOf = l=>{ const t=(2.4-l)/(2.4-(-0.8)); return 148+t*408; };
  const zones=[{r:148,lab:'RIDE OR DIE'},{r:320,lab:'FAIR'},{r:500,lab:'TOUGH ROOM'}];
  const nodes = incoming.map((e,k)=>{ const a=-Math.PI/2+k*(2*Math.PI/(incoming.length||1)); const r=rOf(e.lean);
    return {...e, x:cx+r*Math.cos(a), y:cy+r*Math.sin(a), warm:e.lean>0.5, cold:e.lean<=0.05}; });

  const zoneRings = zones.map(z=>`<circle cx="${cx}" cy="${cy}" r="${z.r}" fill="none" stroke="#3a4451" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 7"/>`).join('');
  const zoneLabels = zones.map(z=>`<text x="${cx}" y="${cy-z.r-10}" text-anchor="middle" fill="#5a6773" font-family="'JetBrains Mono',monospace" font-size="15" font-weight="700" letter-spacing="3">${z.lab}</text>`).join('');
  const tethers = nodes.map(n=> n.cold
    ? `<line x1="${cx}" y1="${cy}" x2="${n.x.toFixed(1)}" y2="${n.y.toFixed(1)}" stroke="#5aa3ff" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="3 10"/>`
    : `<line x1="${cx}" y1="${cy}" x2="${n.x.toFixed(1)}" y2="${n.y.toFixed(1)}" stroke="${rtrCol(roster[n.i].hue,0.7,0.16)}" stroke-width="${n.warm?7:3}" stroke-opacity="${n.warm?0.6:0.3}" stroke-linecap="round"/>`).join('');
  const orbNodes = nodes.map(n=>{ const m=roster[n.i]; const rr=24+n.ballots*2;
    const tier = n.cold?'scores them cold (≤ 0)':(n.warm?'ride-or-die (very generous)':'fair');
    const title = `<title>${esc(m.name)} — ${tier} · ${n.ballots} votes cast on ${esc(roster[hero].first)}</title>`;
    return n.cold
      ? `<circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${rr}" fill="#0c1018" stroke="#5aa3ff" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="5 5">${title}</circle>`
      : `<circle cx="${n.x.toFixed(1)}" cy="${n.y.toFixed(1)}" r="${rr}" fill="${rtrCol(m.hue,n.warm?0.55:0.42,0.13)}" stroke="${rtrCol(m.hue)}" stroke-width="${n.warm?4:2.5}" ${n.warm?'filter="url(#rtr-o-glow)"':''}>${title}</circle>`; }).join('');
  const orbLabels = nodes.map(n=>{ const m=roster[n.i]; const rr=24+n.ballots*2;
    return `<text x="${n.x.toFixed(1)}" y="${(n.y+rr+26).toFixed(1)}" text-anchor="middle" fill="${n.cold?'#7fb2ff':rtrCol(m.hue,0.9,0.09)}" font-family="'Inter Tight',sans-serif" font-size="22" font-weight="700">${esc(m.first)}</text>`; }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <defs><radialGradient id="rtr-o-bg" cx="50%" cy="52%" r="62%"><stop offset="0%" stop-color="#12182a"/><stop offset="100%" stop-color="#050608"/></radialGradient>
    <filter id="rtr-o-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <rect width="${W}" height="${H}" fill="url(#rtr-o-bg)"/>
    ${isExample?`<text x="${cx}" y="70" text-anchor="middle" fill="#5a6773" font-family="'JetBrains Mono',monospace" font-size="22" font-weight="700" letter-spacing="5">EXAMPLE — PICK ANYONE ABOVE</text>`:''}
    ${zoneRings}${zoneLabels}${tethers}${orbNodes}${orbLabels}
    <circle cx="${cx}" cy="${cy}" r="92" fill="${rtrCol(hue,0.55,0.13)}" stroke="${rtrCol(hue)}" stroke-width="6" filter="url(#rtr-o-glow)"/>
    <text x="${cx}" y="${cy+14}" text-anchor="middle" fill="${rtrCol(hue,0.96,0.04)}" font-family="'Bricolage Grotesque',sans-serif" font-size="40" font-weight="800">${esc(roster[hero].first)}</text>
  </svg>`;
}

function rtrLedger(vh, sel, roundKey){
  const roster = vh.roster, N = roster.length;
  const pairs = roundKey==='season'? vh.pairwiseSeason : (vh.pairwiseByRound[roundKey]||[]);
  const lean = new Map(pairs.map(p=>[p.from+'>'+p.to, p]));
  const W=1080,H=1080, gx=210, gy=250, cell=80;
  const litRC = (r,c)=> sel===null || r===sel || c===sel;
  let cells='';
  for(let r=0;r<N;r++) for(let c=0;c<N;c++){
    const x=gx+c*cell, y=gy+r*cell, o = sel===null?1:(litRC(r,c)?1:0.12);
    if(r===c){
      cells += `<rect x="${x+2}" y="${y+2}" width="${cell-4}" height="${cell-4}" rx="5" fill="#0a0d13" opacity="${o}"/>`;
      cells += `<line x1="${x+26}" y1="${y+cell-26}" x2="${x+cell-26}" y2="${y+26}" stroke="#283039" stroke-width="3" stroke-linecap="round" opacity="${o}"/>`;
      continue;
    }
    const p = lean.get(roster[r].name+'>'+roster[c].name);
    if(!p || !p.ballotCount){
      cells += `<rect x="${x+2}" y="${y+2}" width="${cell-4}" height="${cell-4}" rx="5" fill="none" stroke="#1c232c" stroke-width="1" stroke-dasharray="2 4" opacity="${o}"><title>${esc(roster[r].first)} → ${esc(roster[c].first)}: no ballots</title></rect>`;
      continue;
    }
    const l = p.leanScorePerBallot;
    const numTip = `net ${p.netPoints>0?'+':''}${p.netPoints} pts over ${p.ballotCount} ballot${p.ballotCount===1?'':'s'} (lean ${l>0?'+':''}${l})`;
    if(l>0){ const op=(0.12+Math.min(l,2.4)/2.4*0.88)*o, hueMix=42-Math.min(l,2.4)/2.4*30;
      cells += `<rect x="${x+2}" y="${y+2}" width="${cell-4}" height="${cell-4}" rx="5" fill="${rtrCol(hueMix,0.68,0.2)}" fill-opacity="${op.toFixed(2)}"><title>${esc(roster[r].first)} → ${esc(roster[c].first)}: gives love — ${numTip}</title></rect>`;
    } else if(l<0){ const op=(0.35+Math.min(Math.abs(l),0.8)/0.8*0.55)*o;
      cells += `<rect x="${x+2}" y="${y+2}" width="${cell-4}" height="${cell-4}" rx="5" fill="#0e1a2b" opacity="${o}"/>`;
      cells += `<rect x="${x+2}" y="${y+2}" width="${cell-4}" height="${cell-4}" rx="5" fill="url(#rtr-hatch)" fill-opacity="${op.toFixed(2)}"/>`;
      cells += `<rect x="${x+2}" y="${y+2}" width="${cell-4}" height="${cell-4}" rx="5" fill="none" stroke="#5aa3ff" stroke-width="1.5" stroke-opacity="${op.toFixed(2)}"><title>${esc(roster[r].first)} → ${esc(roster[c].first)}: a grudge — ${numTip}</title></rect>`;
    } else {
      cells += `<rect x="${x+2}" y="${y+2}" width="${cell-4}" height="${cell-4}" rx="5" fill="#141921" fill-opacity="${(0.6*o).toFixed(2)}"><title>${esc(roster[r].first)} → ${esc(roster[c].first)}: neutral — ${numTip}</title></rect>`;
    }
  }
  const colLabels = roster.map((m,c)=>{ const o=sel===null?1:(c===sel?1:0.4); const lx=gx+c*cell+cell/2, ly=gy-14;
    return `<text x="${lx}" y="${ly}" text-anchor="start" fill="${rtrCol(m.hue,0.82,0.12)}" font-family="'Inter Tight',sans-serif" font-size="19" font-weight="${c===sel?800:600}" opacity="${o}" transform="rotate(-42 ${lx} ${ly})">${esc(m.first)}</text>`; }).join('');
  const rowLabels = roster.map((m,r)=>{ const o=sel===null?1:(r===sel?1:0.4);
    return `<text x="${gx-16}" y="${gy+r*cell+cell/2+7}" text-anchor="end" fill="${rtrCol(m.hue,0.82,0.12)}" font-family="'Inter Tight',sans-serif" font-size="20" font-weight="${r===sel?800:600}" opacity="${o}">${esc(m.first)}</text>`; }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <defs><pattern id="rtr-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#12233a"/><line x1="0" y1="0" x2="0" y2="8" stroke="#5aa3ff" stroke-width="3"/></pattern></defs>
    <rect width="${W}" height="${H}" fill="#070a0f"/>
    <text x="${gx-150}" y="${gy-84}" fill="#8b97a4" font-family="'Inter Tight',sans-serif" font-size="22" font-weight="600">row gives to ↓ → column</text>
    ${cells}${colLabels}${rowLabels}
    <g transform="translate(${gx},${gy+N*cell+50})">
      <rect x="0" y="-22" width="28" height="28" rx="5" fill="${rtrCol(20,0.68,0.2)}" fill-opacity="0.95"/><text x="38" y="0" fill="#c2cad3" font-family="'Inter Tight',sans-serif" font-size="22" font-weight="600">more love</text>
      <rect x="230" y="-22" width="28" height="28" rx="5" fill="url(#rtr-hatch)"/><rect x="230" y="-22" width="28" height="28" rx="5" fill="none" stroke="#5aa3ff" stroke-width="1.5"/><text x="268" y="0" fill="#c2cad3" font-family="'Inter Tight',sans-serif" font-size="22" font-weight="600">a grudge</text>
    </g>
  </svg>`;
}

function rtrContra(vh, sel){
  const roster=vh.roster, rounds=vh.rounds, csigned=vh.contrarian.csigned, cabs=vh.contrarian.cabs;
  const N=roster.length, M=rounds.length;
  const W=1080,H=1080, gx=210, gy=250, cw=84, ch=60, maxSig=0.65;
  let cells='';
  for(let r=0;r<N;r++) for(let c=0;c<M;c++){
    const x=gx+c*cw, y=gy+r*ch, v=csigned[r][c], o=sel===null?1:(r===sel?1:0.12);
    if(v===null||v===undefined){
      cells += `<rect x="${x+3}" y="${y+3}" width="${cw-6}" height="${ch-6}" rx="4" fill="#0c0f15" stroke="#1c232c" stroke-width="1" stroke-dasharray="2 4" opacity="${o}"><title>${esc(roster[r].first)} didn't vote in ${esc(rounds[c].short)}</title></rect>`;
      continue;
    }
    const t = Math.min(Math.abs(v),maxSig)/maxSig, color = v>0? rtrCol(36,0.7,0.19) : '#5aa3ff';
    const tip = `${esc(roster[r].first)} in ${esc(rounds[c].short)}: ${v>0?'kinder':'harsher'} than the room (${v>0?'+':''}${v})`;
    cells += `<rect x="${x+3}" y="${y+3}" width="${cw-6}" height="${ch-6}" rx="4" fill="${color}" fill-opacity="${((0.1+t*0.85)*o).toFixed(2)}"><title>${tip}</title></rect>`;
  }
  const maxC=Math.max(...cabs), minC=Math.min(...cabs), barX=gx+M*cw+34, barW=150;
  const roundHeaders = rounds.map((rd,c)=>{ const lx=gx+c*cw+cw/2, ly=gy-14;
    return `<text x="${lx}" y="${ly}" text-anchor="start" fill="#8b97a4" font-family="'Inter Tight',sans-serif" font-size="18" font-weight="600" transform="rotate(-42 ${lx} ${ly})">${esc(rd.short)}</text>`; }).join('');
  const rowLabels = roster.map((m,r)=>{ const o=sel===null?1:(r===sel?1:0.4);
    return `<text x="${gx-16}" y="${gy+r*ch+ch/2+7}" text-anchor="end" fill="${rtrCol(m.hue,0.82,0.12)}" font-family="'Inter Tight',sans-serif" font-size="20" font-weight="${r===sel?800:600}" opacity="${o}">${esc(m.first)}</text>`; }).join('');
  const bars = roster.map((m,r)=>{ const t=(cabs[r]-minC)/((maxC-minC)||1); const w=26+t*(barW-26); const y=gy+r*ch+ch/2; const o=sel===null?1:(r===sel?1:0.2);
    return `<g opacity="${o}"><rect x="${barX}" y="${y-8}" width="${barW}" height="16" rx="8" fill="#12161d"/><rect x="${barX}" y="${y-8}" width="${w.toFixed(1)}" height="16" rx="8" fill="${rtrCol(m.hue,0.66,0.16)}" fill-opacity="0.9"/></g>`; }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <rect width="${W}" height="${H}" fill="#070a0f"/>
    <text x="${gx}" y="${gy-92}" fill="#8b97a4" font-family="'Inter Tight',sans-serif" font-size="22" font-weight="600">each vote vs the room, round by round</text>
    ${roundHeaders}${rowLabels}${cells}
    <text x="${barX}" y="${gy-14}" fill="#8b97a4" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700">MAVERICK</text>
    ${bars}
    <g transform="translate(${gx},${gy+N*ch+52})">
      <rect x="0" y="-22" width="28" height="28" rx="5" fill="${rtrCol(36,0.7,0.19)}" fill-opacity="0.95"/><text x="38" y="0" fill="#c2cad3" font-family="'Inter Tight',sans-serif" font-size="22" font-weight="600">kinder</text>
      <rect x="180" y="-22" width="28" height="28" rx="5" fill="#5aa3ff" fill-opacity="0.95"/><text x="218" y="0" fill="#c2cad3" font-family="'Inter Tight',sans-serif" font-size="22" font-weight="600">harsher</text>
    </g>
  </svg>`;
}

function rtrExplainers(vh, sel){
  const roster=vh.roster, rounds=vh.rounds, csigned=vh.contrarian.csigned, cabs=vh.contrarian.cabs;
  const idxByName=new Map(roster.map((r,i)=>[r.name,i]));
  const fn=i=>roster[i].first;
  const outEdges=i=> vh.pairwiseSeason.filter(p=>p.from===roster[i].name).map(p=>({...p, j:idxByName.get(p.to)}));
  const inEdges=i=> vh.pairwiseSeason.filter(p=>p.to===roster[i].name).map(p=>({...p, j:idxByName.get(p.from)}));

  if(sel===null){
    return {
      webHead:'The whole favor economy, in one loop.',
      webBody:'Every warm cord runs from a player to whoever they lift hardest — follow the chain around. The cold dashed lines are the handful of genuine grudges.',
      orbitHead:'Pick anyone to make the room orbit them.',
      orbitBody:'Distance is the read: ride-or-dies pull into the core, a tough crowd gets flung to the cold edge on a broken line. Shown here as an example — Matt.',
      ledgerHead:'Who lifts who, top to bottom.',
      ledgerBody:'Each cell is one player’s lean toward another; brighter warm = more love given. Downvotes get their own language — a cold hatched cell — so a grudge reads as its own thing, not just faint praise.',
      contraHead:'Who votes with the room, and who fights it.',
      contraBody:'A column per round, a row per player. Warm = kinder than the room that round, cold = harsher. The bar is the season maverick score.'
    };
  }
  const f = esc(fn(sel));
  const myOut = outEdges(sel).sort((a,b)=>b.netPoints-a.netPoints);
  const carry = myOut[0];
  const inTop = inEdges(sel).sort((a,b)=>b.netPoints-a.netPoints)[0];
  const myBeef = myOut.filter(e=>e.netPoints<0).sort((a,b)=>a.netPoints-b.netPoints)[0];
  const inc = inEdges(sel).map(e=>({j:e.j, lean:e.leanScorePerBallot??0})).sort((a,b)=>b.lean-a.lean);
  const closest = inc[0], tough = inc[inc.length-1];
  const gWarm = myOut[0], gCold = myOut[myOut.length-1];
  const row = csigned[sel]||[];
  let gi=-1,hi=-1,gv=-9,hv=9;
  row.forEach((v,i)=>{ if(v===null||v===undefined) return; if(v>gv){gv=v;gi=i;} if(v<hv){hv=v;hi=i;} });
  const rank = [...cabs].map((v,i)=>({i,v})).sort((a,b)=>b.v-a.v).findIndex(x=>x.i===sel)+1;

  return {
    webHead: carry? `${f} carries ${esc(fn(carry.j))} the hardest.` : `${f} hasn’t handed out enough points to carry anyone yet.`,
    webBody: `${inTop?`The player who lifts ${f} back the most is ${esc(fn(inTop.j))}. `:''}${myBeef?`The one bit of real beef: ${f} → ${esc(fn(myBeef.j))}.`:`${f} keeps no genuine grudges — no negative bonds at all.`}`,
    orbitHead: closest? `${f}’s ride-or-die is ${esc(fn(closest.j))}.` : `Not enough incoming votes yet to chart ${f}’s orbit.`,
    orbitBody: (closest&&tough)? `Closest in is ${esc(fn(closest.j))}, who scores ${f} generously nearly every time. Out on the cold edge sits ${esc(fn(tough.j))} — the toughest room ${f} plays to.` : '',
    ledgerHead: gWarm? `${f} gives the most love to ${esc(fn(gWarm.j))}.` : `${f} hasn’t cast enough ballots yet for a clear favorite.`,
    ledgerBody: gCold? `Read across ${f}’s row to see who they reward. ${gCold.netPoints<0?`The hatched cell is the tell: ${f} holds a real grudge against ${esc(fn(gCold.j))}.`:`Nothing hatched — ${f} spreads points around without a true grudge.`} Read down the column to see how the league treats ${f} back.` : '',
    contraHead: gi>=0? `${f} was most generous in “${esc(rounds[gi].short)}”.` : `${f} hasn’t voted in enough rounds yet for a consensus read.`,
    contraBody: gi>=0? `Against the room, ${f} leaned kindest in ${esc(rounds[gi].short)} and harshest in ${esc(rounds[hi].short)}. Season-long, ${f} ranks #${rank} of ${roster.length} for landing furthest off consensus.` : ''
  };
}

/* ---- overlay + deep-linking ---- */
// Hash scheme: #<sectionId> or, for readTheRoom, #readTheRoom:sel=<idx>&round=<id>
// (params omitted when at default). Kept in sync via replaceState on every
// pivot so the "copy link" and per-card share buttons always capture the
// exact visible state; open/close uses pushState so the back button works.
function currentHash(){
  if(!state.drill) return '';
  if(state.drill==='readTheRoom'){
    const parts=[];
    if(state.rtr.sel!==null) parts.push('sel='+state.rtr.sel);
    if(state.rtr.ledgerRound!=='season') parts.push('round='+state.rtr.ledgerRound);
    return '#'+state.drill+(parts.length? ':'+parts.join('&') : '');
  }
  return '#'+state.drill;
}
function parseHash(){
  const h = location.hash.slice(1);
  if(!h) return null;
  const [id, qs] = h.split(':');
  const params = {};
  if(qs) for(const pair of qs.split('&')){ const [k,v]=pair.split('='); if(k) params[k]=decodeURIComponent(v??''); }
  return {id, params};
}
function applyHashParams(parsed){
  if(parsed.id!=='readTheRoom') return;
  state.rtr.sel = parsed.params.sel!=null ? (parsed.params.sel==='all'?null:Number(parsed.params.sel)) : null;
  state.rtr.ledgerRound = parsed.params.round!=null ? (parsed.params.round==='season'?'season':Number(parsed.params.round)) : 'season';
}
function syncHash(push){
  const url = location.pathname+location.search+currentHash();
  if(push) history.pushState({drill:state.drill}, '', url);
  else history.replaceState({drill:state.drill}, '', url);
}
function openDrill(id){ state.drill=id; syncHash(true); renderOverlay(); $('#ov').classList.add('open'); $('#ov-body').scrollTop=0; }
function closeDrill(){ $('#ov').classList.remove('open'); state.drill=null; history.pushState(null,'', location.pathname+location.search); }
window.addEventListener('popstate', ()=>{
  const parsed = parseHash();
  if(parsed && SECTIONS.find(x=>x.id===parsed.id)){
    applyHashParams(parsed);
    state.drill = parsed.id;
    renderOverlay(); $('#ov').classList.add('open');
  } else {
    $('#ov').classList.remove('open'); state.drill=null;
  }
});
function renderOverlay(){
  const s = SECTIONS.find(x=>x.id===state.drill); if(!s) return;
  $('#ov-top').className = 'ov-top acc-'+s.acc;
  $('#ov-top').innerHTML = `<button class="ov-back" data-close>‹</button><div style="flex:1;min-width:0"><div class="otag">${esc(s.tag)}${s.draft?' · Draft':''}</div><div class="oname">${esc(s.name)}</div></div><button class="ov-back" data-copylink title="Copy link to this view" style="flex:none;font-size:15px">🔗</button>`;
  $('#ov-body').className = 'ov-body acc-'+s.acc;
  $('#ov-body').innerHTML = VIEWS[s.id]();
  syncHash(false);
}

/* ---- Read The Room: export a card as a shareable/saveable PNG ---- */
function unescapeHtml(s){ const el=document.createElement('textarea'); el.innerHTML=s; return el.value; }
function rtrWrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines){
  const words = text.split(' '); let line='', ly=y, lines=0;
  for(const w of words){
    const test = line? line+' '+w : w;
    if(ctx.measureText(test).width > maxWidth && line){
      ctx.fillText(line, x, ly); lines++; if(lines>=maxLines) return;
      line=w; ly+=lineHeight;
    } else line=test;
  }
  if(line) ctx.fillText(line, x, ly);
}
// SVG -> canvas rasterization (in-chart text falls back to system sans/mono —
// isolated SVG-image rendering can't see the page's @font-face fonts; the
// caption band below uses canvas fillText, which CAN, so headline/eyebrow
// stay pixel-faithful). No external libraries, no network requests.
async function rtrExportCard(svgEl, opts){
  await (document.fonts && document.fonts.ready);
  const xml = new XMLSerializer().serializeToString(svgEl);
  const blobUrl = URL.createObjectURL(new Blob([xml], {type:'image/svg+xml;charset=utf-8'}));
  const img = new Image();
  await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=blobUrl; });
  URL.revokeObjectURL(blobUrl);

  const vb = svgEl.viewBox.baseVal;
  const scale = 2, capH = 260, pad = 56;
  const W = Math.round(vb.width*scale), chartH = Math.round(vb.height*scale);
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = chartH+capH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#050608'; ctx.fillRect(0,0,W,chartH+capH);
  ctx.drawImage(img, 0, 0, W, chartH);
  ctx.fillStyle = '#0d1116'; ctx.fillRect(0, chartH, W, capH);
  ctx.strokeStyle = '#283039'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0,chartH); ctx.lineTo(W,chartH); ctx.stroke();

  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#ff5b2e';
  ctx.font = "700 26px 'JetBrains Mono', monospace";
  ctx.fillText(unescapeHtml(opts.eyebrow).toUpperCase(), pad, chartH+56);
  ctx.fillStyle = '#f1f4f7';
  ctx.font = "800 40px 'Bricolage Grotesque', sans-serif";
  rtrWrapText(ctx, unescapeHtml(opts.headline), pad, chartH+110, W-pad*2, 48, 2);
  ctx.fillStyle = '#5a6773';
  ctx.font = "600 22px 'JetBrains Mono', monospace";
  ctx.fillText('BOARZ II MEN · READ THE ROOM', pad, chartH+capH-30);

  const blob = await new Promise(res=>canvas.toBlob(res,'image/png'));
  const file = new File([blob], opts.filename, {type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:opts.eyebrow, text:opts.shareText}); return 'shared'; }
    catch(e){ if(e && e.name==='AbortError') return 'cancelled'; /* fall through to download */ }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = opts.filename;
  document.body.appendChild(a); a.click(); a.remove();
  return 'saved';
}
function rtrHandleExport(btn){
  const kind = btn.dataset.rtrexport;
  const vh = TAPE.votingHabits;
  const cardEl = btn.closest('[data-rtrcard]');
  const svgEl = cardEl && cardEl.querySelector('svg');
  if(!vh || !svgEl) return;
  const ex = rtrExplainers(vh, state.rtr.sel);
  const eyebrowMap = {web:'The Favor Web', orbit:'The Reception Orbit', ledger:'The Heat Ledger', contra:'Against the Grain'};
  const headMap = {web:ex.webHead, orbit:ex.orbitHead, ledger:ex.ledgerHead, contra:ex.contraHead};
  const who = state.rtr.sel===null? 'everyone' : vh.roster[state.rtr.sel].first.toLowerCase().replace(/\s+/g,'-');
  const roundTag = kind==='ledger' ? '-'+(state.rtr.ledgerRound==='season'?'season':(vh.rounds.find(r=>r.id===state.rtr.ledgerRound)?.short||'round').toLowerCase().replace(/\s+/g,'-')) : '';
  const filename = `boarz-read-the-room-${kind}-${who}${roundTag}.png`;
  const shareUrl = location.origin+location.pathname+location.search+currentHash();
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '…';
  rtrExportCard(svgEl, {eyebrow:eyebrowMap[kind], headline:headMap[kind], filename, shareText:shareUrl})
    .catch(()=>{})
    .finally(()=>{ btn.disabled=false; btn.textContent=label; });
}

  },
  heatmap(){
    const people = TAPE.people;
    const grid = state.heat.person==='Everyone'
      ? DAYS.map((_,d)=>Array.from({length:24},(_,h)=>people.reduce((s,p)=>s+((p.heatmap&&p.heatmap[d]&&p.heatmap[d][h])||0),0)))
      : (people.find(p=>p.name===state.heat.person).heatmap);
    let max=1; grid.forEach(r=>r.forEach(v=>{if(v>max)max=v;}));
    const pills = ['Everyone'].concat(people.map(p=>p.name)).map(n=>`<button class="chip ${n===state.heat.person?'on sky':''}" data-heat="${esc(n)}">${n==='Everyone'?'Everyone':esc(n.split(' ')[0])}</button>`).join('');
    const rows = grid.map((row,d)=>`<div class="hday">${DAYS[d]}</div>`+row.map(v=>{const a=v?0.12+0.88*Math.pow(v/max,0.6):0;return `<div class="hcell" title="${v}" style="background:${v?`rgba(90,163,255,${a.toFixed(3)})`:'var(--ink-2)'}"></div>`;}).join('')).join('');
    const hrs = '<div></div>'+[0,3,6,9,12,15,18,21].map(h=>`<div class="hhr" style="grid-column:span 3">${h}</div>`).join('');
    return `<p class="lead">Day of week against hour of day. Switch to one person to see their own shape — <b>the night posters give themselves away.</b></p>
    <div class="chips" style="margin-bottom:14px">${pills}</div>
    <div class="hm">${rows}</div>
    <div class="hm" style="margin-top:4px">${hrs}</div>
    <div class="mono" style="font-size:9.5px;color:var(--fg-quiet);margin-top:10px;text-align:center">midnight ← hour of day → 9pm · brighter = more messages</div>`;
  },
  readTheRoom(){
    const vh = TAPE.votingHabits;
    if(!vh) return `<p class="lead">Voting data isn't wired up yet.</p>`;
    const sel = state.rtr.sel, ledgerRound = state.rtr.ledgerRound;
    const ex = rtrExplainers(vh, sel);

    const chips = `<div class="chips" style="margin-bottom:18px">
      <button class="chip ${sel===null?'on':''}" data-rtrsel="all">Everyone</button>
      ${vh.roster.map((m,i)=>`<button class="chip ${sel===i?'on':''}" data-rtrsel="${i}" style="${sel===i?`background:${rtrCol(m.hue,0.6,0.16)};color:#050608;border-color:${rtrCol(m.hue)}`:''}">${esc(m.first)}</button>`).join('')}
    </div>`;
    const roundChips = `<div class="chips" style="margin-bottom:12px">
      <button class="chip ${ledgerRound==='season'?'on':''}" data-rtrround="season">Season</button>
      ${vh.rounds.map(r=>`<button class="chip ${ledgerRound===r.id?'on':''}" data-rtrround="${r.id}">${esc(r.short)}</button>`).join('')}
    </div>`;

    const card = (kind, eyebrow, head, body, svg, keyHtml) => `<div class="card" data-rtrcard="${kind}" style="padding:0;overflow:hidden;margin-bottom:20px">
      <div style="position:relative;background:#050608;padding:14px">
        <button data-rtrexport="${kind}" title="Share or save this view as an image" style="position:absolute;top:10px;right:10px;z-index:2;background:rgba(13,17,22,.85);border:1px solid var(--ink-4);color:var(--fg-2);border-radius:999px;padding:6px 12px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;display:flex;align-items:center;gap:5px">⇪ Share</button>
        ${svg}
      </div>
      <div style="padding:18px 17px;display:flex;flex-direction:column;gap:10px">
        <div class="mono" style="font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-quiet)">${esc(eyebrow)}</div>
        <div style="font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--fg);line-height:1.15">${head}</div>
        <div style="font-size:13.5px;line-height:1.6;color:var(--fg-2)">${body}</div>
        <div style="display:flex;flex-direction:column;gap:8px;padding-top:12px;margin-top:4px;border-top:1px solid var(--ink-4)">
          <div class="mono" style="font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-quiet)">What you're seeing</div>
          ${keyHtml}
        </div>
      </div>
    </div>`;
    const legendRow = (icon, html) => `<div style="display:flex;align-items:center;gap:10px"><span style="flex:none">${icon}</span><span style="font-size:12px;line-height:1.5;color:var(--fg-2)">${html}</span></div>`;

    const webKey = legendRow(`<svg width="34" height="13"><line x1="2" y1="6" x2="30" y2="6" stroke="#ff8a2e" stroke-width="6" stroke-linecap="round"/><circle cx="24" cy="6" r="3.5" fill="#ffd0a8"/></svg>`,
        `<b style="color:var(--fg)">Cord + dot</b> — points to who they carry hardest; the dot is the arrowhead.`)
      + legendRow(`<svg width="34" height="13"><line x1="2" y1="6" x2="30" y2="6" stroke="#5aa3ff" stroke-width="2.5" stroke-dasharray="3 5"/></svg>`,
        `<b style="color:var(--fg)">Cold dashed</b> — genuine beef (net-negative points).`)
      + `<div style="padding:8px 11px;background:#16263f;border-radius:8px;font-size:11.5px;line-height:1.5;color:#bcd6ff"><b>No line ≠ dislike.</b> Only each player's single strongest bond is drawn.</div>`;
    const orbitKey = `<div style="font-size:12px;color:var(--fg-2)"><b style="color:var(--fg)">Distance from center</b> = how kindly that person scores this player. Closer = kinder.</div>`
      + legendRow(`<svg width="34" height="13"><line x1="2" y1="6" x2="30" y2="6" stroke="#7cd6a0" stroke-width="6" stroke-linecap="round"/></svg>`, `<b style="color:var(--fg)">Thick solid</b> — ride-or-die.`)
      + legendRow(`<svg width="34" height="13"><line x1="2" y1="6" x2="30" y2="6" stroke="#8b97a4" stroke-width="3" stroke-linecap="round"/></svg>`, `<b style="color:var(--fg)">Thin solid</b> — fair.`)
      + legendRow(`<svg width="34" height="13"><line x1="2" y1="6" x2="30" y2="6" stroke="#5aa3ff" stroke-width="2" stroke-dasharray="3 6"/></svg>`, `<b style="color:var(--fg)">Dotted</b> — cold room (scores at/below zero).`)
      + `<div style="font-size:12px;color:var(--fg-2)"><b style="color:var(--fg)">Dot size</b> = how many times they've voted on this player.</div>`;
    const ledgerKey = `<div style="font-size:12px;color:var(--fg-2)"><b style="color:var(--fg)">Row</b> = points given. <b style="color:var(--fg)">Column</b> = points received.</div>`
      + legendRow(`<svg width="34" height="14"><rect x="1" y="1" width="12" height="12" rx="3" fill="#ff8a2e" fill-opacity="0.35"/><rect x="18" y="1" width="12" height="12" rx="3" fill="#ff8a2e" fill-opacity="0.95"/></svg>`, `<b style="color:var(--fg)">Warm, brighter</b> = more love.`)
      + legendRow(`<svg width="34" height="14"><rect x="1" y="1" width="12" height="12" rx="3" fill="#12233a" stroke="#5aa3ff"/></svg>`, `<b style="color:var(--fg)">Hatched blue</b> = a real grudge, not dim love.`)
      + `<div style="font-size:12px;color:var(--fg-2)">Tap Season or a round above to filter. Every cell's tooltip shows the real number.</div>`;
    const contraKey = `<div style="font-size:12px;color:var(--fg-2)"><b style="color:var(--fg)">Row</b> = a player. <b style="color:var(--fg)">Column</b> = a round.</div>`
      + legendRow(`<svg width="34" height="14"><rect x="1" y="1" width="14" height="12" rx="3" fill="#ff8a2e" fill-opacity="0.9"/><rect x="18" y="1" width="14" height="12" rx="3" fill="#5aa3ff" fill-opacity="0.9"/></svg>`, `<b style="color:var(--fg)">Warm</b> = kinder than the room; <b style="color:var(--fg)">cold</b> = harsher.`)
      + `<div style="font-size:12px;color:var(--fg-2)"><b style="color:var(--fg)">Bar</b> = season maverick score — how far off consensus, either direction.</div>`;

    return `<p class="lead">Pick a player to light up everything the league already knows about how they vote — and how the room votes on them. Leave it on Everyone for the lay of the land.</p>
    ${chips}
    ${card('web', 'The Favor Web', ex.webHead, ex.webBody, rtrWeb(vh, sel), webKey)}
    ${card('orbit', 'The Reception Orbit', ex.orbitHead, ex.orbitBody, rtrOrbit(vh, sel), orbitKey)}
    <div class="sub" style="margin-bottom:8px">The Heat Ledger · filter by round</div>
    ${roundChips}
    ${card('ledger', 'The Heat Ledger', ex.ledgerHead, ex.ledgerBody, rtrLedger(vh, sel, ledgerRound), ledgerKey)}
    ${card('contra', 'Against the Grain', ex.contraHead, ex.contraBody, rtrContra(vh, sel), contraKey)}`;
  },
  regulars(){
    return `<p class="lead">Every member has a fingerprint — a thing they do, on the record, on separate dates, that would identify them with the name scrubbed off. <b>${regCount()} of them, up to three per man.</b></p>
    <div class="stack">${TAPE.editorial.regulars.map(p=>{
      const full = REG_FULLNAME[p.player]||p.player; const col=pcolor(full); const open=!!state.reg.open[p.player];
      const hasSpot = p.entries.some(e=>e.spotlight);
      return `<div class="acc" style="border-color:${open?col:'var(--ink-4)'}">
        <button data-reg="${esc(p.player)}"><span class="av" style="background:${col}">${esc(initials(full))}</span>
          <span class="amid"><span class="aname">${esc(full)}</span><span class="acount">${p.entries.length} on file${hasSpot?' · spotlight':''}</span></span>
          <span class="chev" style="transform:rotate(${open?90:0}deg)">›</span></button>
        ${open?`<div class="acc-body">${p.entries.map(e=>renderEntry(e,col)).join('')}</div>`:''}
      </div>`;
    }).join('')}</div>`;
  },
  glossary(){
    return `<p class="lead">The words and phrases this league invented, adopted, or ruined for general use — <b>preserved in perpetuity.</b> Entries tagged "digest" came from the weekly recaps.</p>
    <div class="stack" style="gap:12px">${TAPE.editorial.glossary.map(g=>{
      const digest = /digest/.test(g._source||'');
      const c = g.coined||{};
      const coinLine = ['coined by '+(c.by||'—'), c.date, c.at?('at '+c.at):'', c.context].filter(Boolean).join(' · ');
      return `<div class="gl">
        <div><div class="gterm">${esc(g.term)}</div><div class="gpron">${esc(g.pronunciation||'')} &nbsp;<span class="gpos">${esc(g.part_of_speech||'')}</span></div></div>
        <div class="gdef">${esc((g.definition||'').trim())}</div>
        ${(g.usages||[]).map(u=>`<div class="usage"><span class="ul">${esc(u.label)} · ${esc(u.speaker)}</span><span class="ut">${esc(u.text)}</span></div>`).join('')}
        <div class="gcoin">${esc(coinLine)}${g.stats?('  ·  '+Object.entries(g.stats).map(([k,v])=>v+' '+k.replace('_',' ')).join(' · ')):''}</div>
        <span class="gsrc">${digest?'from the digest':'from the tape'}</span>
      </div>`;
    }).join('')}</div>`;
  },
  songs(){
    const s = TAPE.songs;
    const sharers = ['All'].concat([...new Set(s.links.map(l=>l.person))]);
    const list = state.tl.filter==='All'? s.links : s.links.filter(l=>l.person===state.tl.filter);
    const num = new Map(s.links.map((l,i)=>[l,i+1]));
    const art = l => l.track&&l.track.art
      ? `<img class="tart" loading="lazy" src="${esc(l.track.art)}" alt="" onerror="this.style.visibility='hidden'">`
      : `<span class="tart"></span>`;
    const row = l => `<div class="trow acc-pulp"><span class="tn">${num.get(l)}</span>${art(l)}<span class="tmid">
      <span class="tt">${esc(l.track&&l.track.title?l.track.title:'(unresolved link)')}</span>
      <span class="ta">${esc(l.track&&l.track.artists?l.track.artists:l.kind)}</span>
      <span class="tby">${esc(l.person)}${l.context?' · "'+esc(l.context)+'"':''}</span></span></div>`;
    // Folded-by-round when the data carries round tags; flat chronological otherwise.
    let body;
    if(Array.isArray(s.rounds)&&s.links.some(l=>l.roundNum)){
      const groups = s.rounds.map(r=>({...r, links:list.filter(l=>l.roundNum===r.num)})).filter(g=>g.links.length);
      body = `<div class="stack" style="gap:10px">${groups.map(g=>{
        const open = !!state.tl.open[g.num];
        return `<div class="acc racc" style="border-color:${open?'var(--mash-pulp)':'var(--ink-4)'}">
          <button data-tlr="${g.num}"><span class="rbadge">R${g.num}</span>
            <span class="amid"><span class="aname">${esc(g.name)}</span><span class="acount">${g.links.length} track${g.links.length===1?'':'s'}</span></span>
            <span class="chev" style="transform:rotate(${open?90:0}deg)">›</span></button>
          ${open?`<div class="acc-body" style="gap:0">${g.links.map(row).join('')}</div>`:''}</div>`;
      }).join('')}</div>`;
    } else {
      body = `<div>${list.map(row).join('')}</div>`;
    }
    return `<p class="lead"><b>The season podium</b> — the three highest-scoring submissions to date — then every song anybody dropped into the chat, folded by the round that was in play. <b>${s.links.length} tracks</b>, all a real playlist.</p>
    <div class="podium"><div class="ph">The podium · season to date</div>${s.podium.map(p=>`<div class="prow">
      <span class="pl" style="color:${p.place===1?'var(--amber)':p.place===2?'var(--fg-2)':'var(--mash-pulp-deep)'}">${p.place}</span>
      ${p.art?`<img class="part" loading="lazy" src="${esc(p.art)}" alt="" onerror="this.style.visibility='hidden'">`:''}
      <span class="pmid"><span class="pt">${esc(p.title)}</span><span class="pa">${esc(p.artists)}</span></span>
      <span class="pv">${p.points} pts<br>${esc(p.submitter.split(' ')[0])}</span></div>`).join('')}</div>
    <a class="plbtn" href="${esc(s.playlistUrl)}" target="_blank" rel="noopener">Open the ${s.playlistTracks}-track playlist ▸</a>
    <div class="sub" style="margin-bottom:8px">Everything shared — filter by who dropped it</div>
    <div class="chips" style="margin-bottom:12px">${sharers.map(n=>`<button class="chip ${n===state.tl.filter?'on':''}" data-tl="${esc(n)}">${n==='All'?'All '+s.links.length:esc(n.split(' ')[0])}</button>`).join('')}</div>
    ${body}`;
  },
  method(){
    const g = TAPE.generatedFrom;
    return `<p class="lead">The caveats worth knowing and the confidence behind each finding — <b>because somebody is going to argue with their ranking.</b></p>
    <div class="card acc-ink" style="margin-bottom:16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px">
      ${[['messages',nf(g.messages)],['days',g.days],['people',TAPE.people.length],['songs',TAPE.songs.links.length]].map(([k,v])=>`<div><div style="font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--fg)">${v}</div><div class="mono" style="font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-quiet)">${k}</div></div>`).join('')}
    </div>
    ${TAPE.notes.map(n=>`<div class="note">${esc(n)}</div>`).join('')}`;
  }
};

function renderEntry(e,col){
  let extra='';
  if(e.spotlight) extra += `<div class="spot" style="background:${col}"><div class="st">"${esc(e.spotlight.text)}"</div><div class="sc">${esc(e.spotlight.caption)}</div></div>`;
  if(e.pairs&&e.pairs.length) extra += `<div class="pairs">${e.pairs.map(([r,a])=>`<div class="pair"><span class="pr">${esc(r)}</span><span class="pa">${esc(a)}</span></div>`).join('')}</div>`;
  if(e.token) extra += `<span class="tok" style="color:${col};border-color:${col}">“${esc(e.token)}”</span>`;
  if(e.evidence&&e.evidence.length) extra += e.evidence.map(q=>`<div class="quote" style="border-color:${col}">${esc(q)}</div>`).join('');
  return `<div class="entry"><div class="earch" style="color:${col}">${esc(e.archetype)}</div><div class="emotif">${esc(e.motif)}</div><div class="enote">${esc(e.note)}</div>${extra}</div>`;
}

/* ---- events ---- */
document.addEventListener('click', ev=>{
  const t = ev.target.closest('[data-tab],[data-drill],[data-close],[data-copylink],[data-mb],[data-heat],[data-reg],[data-tlr],[data-tl],[data-rtrsel],[data-rtrround],[data-rtrexport]');
  if(!t) return;
  if(t.dataset.tab!=null){ state.tab=t.dataset.tab; renderTabs(); renderBento(); }
  else if(t.dataset.drill){ openDrill(t.dataset.drill); }
  else if(t.dataset.close!=null){ closeDrill(); }
  else if(t.dataset.copylink!=null){
    const url = location.origin+location.pathname+location.search+currentHash();
    (navigator.clipboard?.writeText(url) ?? Promise.reject()).then(()=>{ t.textContent='✓'; setTimeout(()=>{t.textContent='🔗';},1400); }).catch(()=>{ prompt('Copy this link:', url); });
  }
  else if(t.dataset.rtrexport){ rtrHandleExport(t); }
  else if(t.dataset.mb){ state.mb[t.dataset.mb]=t.dataset.val; renderOverlay(); }
  else if(t.dataset.heat){ state.heat.person=t.dataset.heat; renderOverlay(); }
  else if(t.dataset.reg){ const k=t.dataset.reg; state.reg.open[k]=!state.reg.open[k]; renderOverlay(); }
  else if(t.dataset.tlr){ const k=t.dataset.tlr; state.tl.open[k]=!state.tl.open[k]; renderOverlay(); }
  else if(t.dataset.tl){ state.tl.filter=t.dataset.tl; renderOverlay(); }
  else if(t.dataset.rtrsel!=null){ state.rtr.sel = t.dataset.rtrsel==='all'? null : Number(t.dataset.rtrsel); renderOverlay(); }
  else if(t.dataset.rtrround){ state.rtr.ledgerRound = t.dataset.rtrround==='season'? 'season' : Number(t.dataset.rtrround); renderOverlay(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && state.drill) closeDrill(); });
// PC: tab/chip strips scroll sideways on a plain (vertical) mouse-wheel
// gesture, no shift-key required — a normal trackpad swipe or shift+wheel
// already produces horizontal delta, so this only kicks in when the strip
// actually has room to scroll and the gesture is genuinely vertical.
document.addEventListener('wheel', e=>{
  const strip = e.target.closest('.tabs,.chips');
  if(!strip || strip.scrollWidth<=strip.clientWidth) return;
  if(Math.abs(e.deltaY)<=Math.abs(e.deltaX)) return;
  strip.scrollLeft += e.deltaY;
  e.preventDefault();
}, {passive:false});

/* ---- boot ---- */
$('#mast-meta').textContent = nf(TAPE.generatedFrom.messages)+' messages · '+TAPE.people.length+' players · '+TAPE.songs.links.length+' songs';
$('#foot-msgs').textContent = nf(TAPE.generatedFrom.messages);
renderTabs(); renderBento();
{ const parsed = parseHash();
  if(parsed && SECTIONS.find(x=>x.id===parsed.id)){
    applyHashParams(parsed);
    state.drill = parsed.id;
    renderOverlay(); $('#ov').classList.add('open');
  }
}
</script>
</body>
</html>
